# Bands and verdicts for the backlog board — the judgment layer, kept apart from the
# catalog so an opinion about priority never sits beside a fact about the product.
#
# One row per active catalog id: an entry that has not shipped, been dropped, been
# replaced or been shelved. Shipped, dropped and replaced entries have no band; a shelved
# one needs none, since the board puts it in D.
#
# band, one of four:
#   A  do now       high value, and urgent or blocking other work.
#   B  do next      worth doing, no deadline.
#   C  decide first an open question only the developer can answer stands between the
#                   entry and a plan; the verdict names the question.
#   D  leave it     nothing to do until something happens; the verdict names what.
# An entry that waits on another is banded on its own value, as though what it waits on
# were done; the board marks the wait.
#
# value and effort: whole numbers 1 to 5, each with a one-line reason (valueWhy,
# effortWhy). Inside a band the board and /next rank by value divided by effort, and an
# entry missing either score comes last.
# bundle (optional, after effortWhy): a short kebab-case name. Rows with the same name are
# best done together; the board tags them and /next, suggesting one, names the rest. A
# bundle needs two or more rows. /refresh-board proposes bundles; nothing adds one unasked.
# verdict: one or two sentences, plain English.
# evidence (optional): what was checked against the code, dated, so a reader can tell a
# verified claim from the entry's own text.
#
# A row, with the keys in this order:
#   some-entry:
#     band: B
#     value: 4
#     valueWhy: "One line."
#     effort: 2
#     effortWhy: "One line."
#     verdict: "One or two sentences."
#     evidence: "Optional, dated."
#
# npm --prefix .tropis run board reports ids that have no band, bands whose entry has
# shipped, been dropped, been replaced, been shelved or gone, bands not A to D, and bands
# without both scores. All of it is the board going stale; none fails the build, because
# banding is a judgment and a new idea should not turn the suite red until somebody has
# formed one.
