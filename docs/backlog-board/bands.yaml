# Bands and verdicts for the backlog board — the judgment layer, kept apart from the
# catalog so an opinion about priority never sits beside a fact about the product.
#
# One entry per open catalog id. band: A do now · B do next · C cheap win, batch it ·
# D decide, don't build · E leave alone. verdict: one or two sentences, plain English.
# evidence (optional): what was checked against the code, dated, so a reader can tell a
# verified claim from the entry's own text.
#
# npm --prefix .tropis run board reports ids that have no band, and bands whose entry has shipped or gone.
# Both are the board going stale; neither fails the build, because banding is a judgment
# and a new idea should not turn the suite red until somebody has formed one.

a-run-without-its-gate-is-reported:
  band: B
  value: 3
  valueWhy: A pull request waiting on auto-merge can stall for half an hour with every
    check green and nothing saying why; it happened once in this repository.
  effort: 2
  effortWhy: The merge wait reads the pull request's checks and names a finished run
    with no gate job; the cause itself is out of scope.
  verdict: "Worth doing while agents merge in parallel: name the stalled state, with the
    run's address, instead of timing out in silence. Finding why GitHub skipped the gate
    is not part of it."
  evidence: "2026-11-01 — run 41291063425 on pull request 74 completed with no
    pipeline / gate job and the pull request stayed blocked until a manual re-run."
