# Raised 2026-10-19 by the review of plan 2026-10-19-maintainer-absorbs-contributions-in-groups.
# The plan's script set GIT_CONFIG_GLOBAL=/dev/null and GIT_CONFIG_NOSYSTEM=1 on every git call,
# which turned off the credential helper and committer identity a real run needs. Its tests
# passed only because each temporary repository set its own identity. Fixed there in 20465d7.
# 2026-11-01, shaped for the rule-text bundle. The fixed pattern is in
# guards/absorb-flush.test.js: runScript sets the two variables in the spawned script's
# environment, and a test proves a global committer identity reaches the script. The
# rule says how to write scripts rather than how the code is, so it gets no rule-claims
# assertion; the fresh-agent check is its test.
# Shipped by docs/superpowers/plans/2026-11-01-rule-text-says-what-is-true.md. The
# criteria about rule text are covered by that text and Task 1's checks; the
# fresh-agent criterion by probe S in that plan's handover report.
- id: scripts-never-hide-the-users-git-config
  title: The script rules say a script never hides the user's git config to make its tests repeatable
  status: shipped
  value: Someone writing a framework script that runs git learns from the script rules
    that the tests isolate the script from the developer's git config, never the script
    itself. A script that switches off the global or system config passes its tests and
    then fails on a real machine, because that config holds the credential helper that
    fetches from a private remote and the identity a commit needs.
  acceptanceCriteria:
    - The script rules say a script that runs git uses the git config in force and never
      sets GIT_CONFIG_GLOBAL, GIT_CONFIG_NOSYSTEM or HOME for its own git calls, and say
      why, naming the credential helper and the commit identity.
    - They say the tests isolate the script instead, by setting those in the environment
      they spawn it with and giving each temporary repository its own identity, and that
      a test shows a config the script did not set taking effect.
    - The fresh-agent check the workflow requires for a rule change has an agent write a
      script that commits with git, with repeatable tests, and records whether the script
      or only its tests isolate git config, with tool, version, operating system and
      architecture.
  type: improvement
  layer: product
  modules:
    - rules/harness-scripts.md
  refs:
    - docs/superpowers/plans/2026-11-01-rule-text-says-what-is-true.md
# Raised 2026-10-20 by the developer after the attribution review filed two ideas for one
# shipped entry; both were dropped the same day. Between 2026-10-15 and 2026-10-20 the
# backlog gained 49 entries and shipped 21. Today rules/planning.md lets a review drop a
# finding with a reason, but nothing says when dropping is right, while /idea,
# /capture-learning and the fresh-agent check all route a finding to an entry.
# Shipped 2026-10-20. The fresh-agent criterion is backed by the first probe recorded in
# the body of 9252b4a (Claude Code 2.1.300, dev-laptop.local), which ran on
# exactly the wording that shipped; the review record says why it counts as the pass. The
# criteria about document text are backed by the comparison re-run in that record.
- id: findings-the-flow-would-handle-stay-out-of-the-backlog
  title: A finding the normal flow would handle stays out of the backlog
  status: shipped
  value: Someone reviewing, handing over or probing a change can drop a finding with a
    one-line reason instead of filing an entry, when the next agent would fix it on the
    spot or the normal flow would catch it before it did harm. The backlog then holds
    work someone would otherwise lose, and stops growing faster than it ships.
  acceptanceCriteria:
    - The catalog rule names the two kinds of finding that do not become entries - an
      improvement the next agent in that area would make on the spot, and a bug of little
      or no impact that the normal flow would catch and neutralise - and says a bug that
      fails silently is always an entry, and that a drop carries a one-line reason where
      the finding was reported.
    - The /idea command, used by an agent on a finding of its own, stops with a one-line
      reason when the finding falls under that rule, and captures what the developer asks
      it to capture.
    - The review record's Outstanding disposition, the fresh-agent check's closing step and
      the /capture-learning route to the catalog each name a drop under that rule as a
      complete answer.
    - A fresh agent given three invented findings - one it would fix on the spot, one
      low-impact bug the normal flow catches, one silent hook failure - drops the first two
      with a reason and captures the third; recorded with tool, version and machine.
    - The release notes say a finding no longer has to become a backlog entry, and when.
  type: improvement
  layer: product
  modules:
    - rules/catalogs.md
    - commands/idea.md
    - commands/capture-learning.md
  refs:
    - docs/superpowers/plans/2026-10-20-findings-the-flow-would-handle-stay-out-of-the-backlog.md

# 2026-10-20, from drafting the 0.4.0 notes: the [Unreleased] section had been written
# change by change in the builder's voice, and the developer asked for the rewrite done
# by hand that day (e6b2d70) to become what /release produces. Shipped 2026-10-20. The
# first two criteria are asserted by guards/release.test.js, "the /release drafting
# stage", seen to fail when an instruction is removed. The third is outstanding and does
# not hold the entry back (rules/catalogs.md): the developer observes it on the first
# /release run after a release installs this wording - the one after 0.4.0, since 0.4.0
# itself is drafted with the installed 0.3.1 command - and records it in
# docs/verification-log.md through /manual-check. There is no plan, so this comment is
# where the outstanding observation is recorded.
# Fresh-agent check, after the merge (be6e552), Claude Code 2.1.300 on
# dev-laptop.local, macOS 26.2: given only a scratch clone, commands/release.md
# Stage 3 and five invented builder-voice sections (a jargon-heavy fix, a refactor with no
# effect, a changed default, a renamed command, a one-line fix), it wrote a three-sentence
# summary, put the rename and the changed default as numbered by-hand steps with installed
# .claude/ paths, explained the fix in plain words, made the one-line fix a bullet, and
# dropped the refactor with a reason in the Dropped line. It found the readers line empty
# in the source command and used the installed one; dropped, since the source block is
# the template each project fills and the installed copy here is filled.
- id: release-notes-read-as-the-reader-would
  title: Release notes say what a release does for the people who take it
  status: shipped
  value: Someone taking a release reads a short summary, then what they must do by hand,
    then what they get from each change, in their own words, with small fixes as one-line
    bullets. They no longer have to decode notes written in the voice of whoever built
    each change to find out what the release does for them or what to do after updating.
  acceptanceCriteria:
    - The /release command's drafting stage sets that shape - summary, numbered steps to
      do by hand first, one section per change headed by what the reader gets, small
      fixes as bullets - and says to rewrite notes already in the section to it.
    - It says to spell out the project's internal terms, to leave out changes that change
      nothing for the reader and report them, and to check every path the notes name
      against where the reader actually has it.
    - A /release run on this wording produces notes a person who did not build the
      changes confirms they understand; recorded through /manual-check.
  type: improvement
  layer: product
  modules:
    - commands/release.md
  refs: []

# 2026-10-20, raised by the developer while asking how this repository takes v0.4.0:
# project-takes-a-framework-version shipped "one command", but it is run from a Tropis
# checkout at the release's tag, and the steps around it (a clean tree, a checkout at the
# tag, the safety check, the breaking flag, the by-hand steps the notes list, the ignore
# lines to fix) are left to the reader of the notes.
# Shaped the same day with the developer: the update lands on its own branch, committed,
# and the developer merges it; a step the notes do not mark optional is done or proposed,
# never only printed. A project takes the first release that ships /update by hand, as
# today; every later one through /update.
# The fresh-agent check (a scratch project taking v0.5.1, then aborting at the
# confirmation) is recorded in the body of cc18d5c and in this plan's handover
# report. Claude Code 2.1.300, dev-laptop.local.
- id: project-updates-with-one-slash-command
  title: A project updates to a new framework version with one slash command
  status: shipped
  value: Someone running a project updates it to a newer framework version with one slash
    command run inside the project, without first cloning Tropis or reading the release
    notes for what to do. The command gets the release, checks whether taking it is safe,
    and stops when it is not or when they choose to abort. Otherwise it takes it and does
    every step the new version needs before it can be used, asking them only where a step
    needs their judgement, so that when it finishes the project is ready on the new version.
    Steps they may want but do not need are printed at the end and left to them.
  acceptanceCriteria:
    - Run inside a set-up project with no uncommitted changes, /update takes the newest
      release, or the version named after it, and finishes with the project holding that
      version on a new branch update/<version> started from where it was, committed with
      a message saying what the release brings, with the project's checks passing.
    - It gets the release from the place the project's framework came from, which setup
      and every update record in .tropis/installed.json. A project with no recorded place
      is asked for it once, and the update records it. It uses the user's own git access,
      so a private repository works, and removes the copy it fetched however it ends.
    - Before changing anything it shows whether taking the release is safe, safe with
      steps, or not now, with the reasons, and the by-hand steps of every release after
      the one held. It goes ahead only on the user's yes. On not now it advises against
      going ahead and continues only on an explicit choice to, and a breaking release
      needs an explicit yes after its steps are shown.
    - Aborting at any point before the commit leaves the project as it was - on the branch
      it was on, with the same files, and no update/ branch.
    - After taking the release it does every by-hand step not marked optional in those
      notes, and resolves what the take left for a decision - .new files, shipped files
      the project removed or changed - doing the mechanical ones itself and putting to
      the user, with what it proposes, only those that need their judgement.
    - When the project's checks fail after that, it does not commit. It shows the failures
      and offers to abort or to leave the branch for the user to finish.
    - It ends by printing the steps marked optional and how to merge the branch.
    - /release marks each by-hand step a project may skip as optional. A step not so
      marked is treated as required, so notes written before the marking are never
      skipped.
    - A fresh agent in a scratch project, given a release with one required and one
      optional step, runs /update to a committed update/ branch with the required step
      done and the optional one printed; asked to abort at the confirmation, it leaves the
      project unchanged. Recorded with tool, version and machine.
    - The README's section on taking a new version starts with /update and keeps the two
      scripts as the manual route.
  type: feature
  layer: product
  modules:
    - scripts/update.mjs
    - commands/update.md
  refs:
    - docs/superpowers/plans/2026-10-20-project-updates-with-one-slash-command.md

# 2026-10-20, from the review of plan/project-updates-with-one-slash-command: the
# self-check went red twice and then passed on every re-run of the same commit - once on
# the first run in a fresh worktree, once with five check-version.mjs tests failing beside
# a deliberately broken test. Eight later runs and check-version.test.js alone passed. No
# cause is known, and the failing run's output is not kept anywhere, so it cannot be told
# apart from a real failure or investigated after the fact.
# 2026-10-21, installing v0.4.1: red once more, then three passes on the same commit. Not a
# fresh worktree (it had passed there twice before the rebase), and the verdict line put the
# failure in conformance or the clean baseline, not the framework repository's own guards.
# 2026-10-25, in CI on GitHub (run 40215889029, chore/actions-on-node24): red in the clean
# baseline on a commit whose tree had passed twice, then green on the re-run. So it is not
# local to one machine, and the line naming the failure says only that a guard failed, not
# which one.
# Shaped 2026-11-01, against main at 9180850. scripts/check-conformance.sh sends every
# test run to /dev/null, and when the clean baseline fails it runs the whole suite a second
# time and prints the failures of that second run, so an intermittent failure prints no
# test name at all; that is why the 2026-10-25 CI line said only that a guard failed.
# scripts/check-blueprint.sh's run_guard discards its output the same way.
# Plan: docs/superpowers/plans/2026-11-01-self-check-red-means-something.md.
# Shipped by docs/superpowers/plans/2026-11-01-self-check-red-means-something.md; each
# criterion's test or check is in that plan's handover report.
- id: self-check-red-runs-keep-their-output
  title: A red self-check keeps its output, so an intermittent failure can be found
  status: shipped
  value: Someone whose self-check goes red can find out afterwards which test failed and
    why, even when a re-run passes. Today the run's output is gone once the terminal
    scrolls, so an intermittent failure is either ignored or re-run until green, and a
    real failure that only sometimes shows looks the same as noise.
  acceptanceCriteria:
    - Every test run inside the self-check whose result counts against its verdict keeps
      its full output in a file under .self-check/logs/ in the checkout, and the verdict
      names that folder.
    - When the clean baseline fails, the tests the self-check names are the ones that
      failed in that run, read from its kept output, with no second run.
    - On GitHub Actions the kept output is also printed into the job's log.
    - A self-check that passes leaves no log behind.
    - A guard runs the conformance script with a test command whose clean baseline fails
      once and then passes, and fails if the failing test's name is missing from the
      script's output or from the kept file.
  type: improvement
  layer: framework
  modules:
    - scripts/check-conformance.sh
    - scripts/check-blueprint.sh
    - guards/conformance-output.test.js
  refs: []

# Found releasing v0.4.1 on 2026-10-21. The release job promotes RELEASES.md, commits,
# tags and pushes with the workflow's token, and a push made with that token starts no
# workflow run, so nothing checks the commit that becomes the release. The promotion
# emptied [Unreleased], guards/readme-level.test.js read only that section, and main was
# red until a self-check run by hand found it (fixed in d21c9fd). A failure that nothing
# reports is always an entry (FW-022). The developer's idea: run the self-check after
# promoting and before tagging.
# Shaped 2026-10-27. The release job in .github/workflows/ci.yml runs the self-check on
# the commit it starts from, then promotes RELEASES.md, commits, tags and pushes the new
# commit unchecked. The check runs on the promoted commit, before the tag and the push.
# Plan: docs/superpowers/plans/2026-10-27-release-job-checks-the-commit-it-tags.md.
# Handover report: docs/superpowers/plans/2026-10-27-release-job-checks-the-commit-it-tags.md
# 2026-10-31: its third criterion is superseded by main-is-gated-by-the-host; the release job now pushes only the tag.
- id: release-job-checks-the-commit-it-tags
  title: The release job checks the commit it tags, so a release cannot leave main red
  status: shipped
  value: Someone cutting a release knows that the commit it tags passes the self-check,
    and a release that would break it stops before anything is tagged or published.
    Today the release job's own commit runs no checks, so a guard the promotion of the
    notes breaks leaves main red and unreported, and the next person to run the
    self-check finds a failure they did not cause.
  acceptanceCriteria:
    - The release job runs the self-check on the commit that promotes the release notes,
      the commit it tags, before it pushes anything.
    - When that check fails, the job fails, and neither the commit nor the tag reaches
      the repository on GitHub.
    - When that check passes, the job pushes the commit and its tag together, as it does
      today.
  type: bug
  layer: framework
  modules:
    - .github/workflows/ci.yml
  refs: []

# Found running /refresh-model-tiers on 2026-10-21 (commit d2add2e). The pass ranked Grok
# 4.7 below Composer 2.5 and the developer doubted it; it was wrong on four counts, each
# allowed by the command as written. It compared Coding Agent Index scores from May and
# September, across a change to that index's Terminal-Bench component; compared
# Terminal-Bench 2.0 with 4.0, and an older Artificial Analysis index with v4.3.2; quoted a
# press article's 26% for Grok where Artificial Analysis's own article says 33%; and passed
# over CursorBench 4.0 - the one board scoring both (Grok 46.3%, Composer 27.7%) - because
# the command says to avoid vendor marketing, though Cursor makes neither model except
# Composer. A wrong placement looks exactly like a right one, so nothing in the flow would
# catch it. Cost goes for the same reason: what limits a model draws on is unpublished
# (Cursor does not say how fast each model draws its weekly allowance, Anthropic gives no
# per-model weights for subscription limits), so prices could not be compared across the
# two tools. The developer chose on 2026-10-21 to leave cost to whoever dispatches, and
# the d2add2e picks already drop it; the command still asks for prices.
# Shipped 2026-10-21 by fcapurso/tropis#120. The criteria about what an agent running the
# command writes are backed by fresh-agent checks, not tests; the last of three is recorded
# with its tool, version and machine in the Review record of
# docs/superpowers/plans/2026-10-21-model-picks-compare-like-with-like.md.
- id: model-picks-compare-like-with-like
  title: Model picks rest only on figures that can be compared
  status: shipped
  value: Someone dispatching a plan can trust that a model is placed above another because
    the two were measured the same way - same benchmark and version, same harness, same
    effort setting, in a window where the benchmark did not change - with every figure
    taken from its primary source. Tools' own boards, such as Cursor's CursorBench, count
    as evidence, with a tool's score for its own model marked self-published. Today
    /refresh-model-tiers lets scores from different versions and setups be ranked against
    each other, and a pick can sit a tier too high or too low with nothing to show it.
    Cost is left out for the same reason. How fast a model uses up a plan's limits is not
    published in a form comparable across the supported tools, so the picks place models
    on fitness alone and leave the cost decision to whoever dispatches.
  acceptanceCriteria:
    - /refresh-model-tiers compares two models' scores only when they share the benchmark
      and its version, the harness, the effort setting, and a period in which the
      benchmark did not change, and the picks file records those four next to each
      figure it relies on.
    - When two models share no score measured the same way, the command says not to rank
      one above the other from different boards or versions; the model is still placed,
      never left out of the table, on the strongest independent evidence, and the
      placement is marked unconfirmed against its neighbours.
    - Every figure comes from its primary source, the benchmark's own page or the
      evaluator's own article, and a second-hand figure that disagrees with it is not
      used.
    - Benchmarks a supported tool publishes, such as Cursor's CursorBench, count as
      evidence and are no longer excluded as vendor marketing, and a tool's score for a
      model it makes is marked self-published.
    - The command asks for no prices or price changes, the picks file it describes has no
      price column and says cost is left to whoever dispatches, and /dispatch reads the
      picks exactly as before.
    - Where a shared board reports tokens per task, the picks file records it beside the
      models that board covers, with the board's version, harness and effort, so the
      dispatcher can weigh cost; token counts from different boards are not set side by
      side, and no placement rests on them.
    - Each model sits in the highest tier its evidence supports, and a lower tier's row
      names only models that reach no higher and ends with "or any pick from a higher
      tier", or reads "Any pick from a higher tier" when it has no model of its own.
    - A fresh agent running a probe refresh, given two models whose only scores come from
      different versions of one benchmark, declines to rank them on those scores, and the
      check is recorded with its tool, version and machine.
  type: bug
  layer: framework
  modules:
    - commands/refresh-model-tiers.md
    - guards/dispatch.test.js
  refs:
    - docs/superpowers/plans/2026-10-21-model-picks-compare-like-with-like.md
