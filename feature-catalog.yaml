- id: cursor-agents-receive-area-rules
  title: Find out what makes an area rule reach a Cursor agent
  status: shipped
  value: Before any work projects rule areas for Cursor, we know a way for a Cursor agent
    working on a file to receive that file's area rule, measured from inside Cursor, or
    know there is none. Today Cursor agents get the workflow and no area rule at all, so
    the glob projection this framework generates delivers nothing.
  acceptanceCriteria:
    - A written finding records, for each candidate way of delivering an area rule,
      whether a fresh Cursor agent received the rule when it read a file in the area,
      when it edited one, and when it was working in the area without opening the file,
      each with the Cursor version and machine it ran on.
    - The candidates include at least the generator's current output, the same rule
      with its globs written in each form Cursor's own documentation shows at the time
      of the run, Cursor's current rule-file layout if it has changed since 3.23.12, a
      rule Cursor applies on its own judgement from a description, a per-folder
      AGENTS.md, a rule-sync tool's Cursor output, and a hook on Read replying through
      hook-reply.sh.
    - Every run is in a throwaway project with invented rule areas, not in this
      repository or a real project, and each rule carries a marker sentence so whether
      it arrived is read from the agent's answer rather than inferred.
    - Each run first repeats the audit's case — the generator's current output, a Read
      in the area — so a change in Cursor since 3.23.12 is told apart from a candidate
      that works.
    - Any candidate that works without a hook is also measured in Claude Code, so the
      finding says whether one mechanism serves both tools or each needs its own — as
      the paths header is Claude Code's own.
    - The finding ends with a recommendation for rule-areas-are-project-data, put to the
      developer — a mechanism shared by both tools if one works, otherwise Cursor's own
      native one, a hook only if no hook-free mechanism delivers, and if nothing does,
      what the framework then says to Cursor users — and framework/rule-delivery.md says
      what was measured.
  type: spike
