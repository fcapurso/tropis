# 2026-10-31, shaped with the developer from a-failing-push-is-visible. Prevention
# belongs to the host, which can refuse a red merge; Tropis's part is to ship the
# settings, to fail the pipeline until the project has either applied them or said why
# not, and to make the workflow match. A private repository on GitHub's free plan cannot
# have the gate, and Tropis does not build a substitute - it makes the gap impossible to
# miss. The ruleset has no bypass, which is why this repository's release becomes a tag
# of what the main branch holds; an adopter's release does the same under
# release-tags-what-main-holds.
# Criteria to tests. 1: the ruleset test in guards/pipeline.test.js ('GitHub workflow')
# and the installed list in guards/set-up-project.test.js. 2: guards/pipeline.test.js
# 'host', cases 2 to 9. 3: 'host', case 1. 4: the bootstrap and update tests in 'the
# pipeline offer', guards/release.test.js. 5: 'the gate in the workflow' and the release
# and refresh-board test in guards/release.test.js, and the gated commit-hook tests in
# guards/rule-delivery.test.js. 6: the rerun and retry tests in 'the gate in the
# workflow'. 7: 'the release job' and 'checkReleased' in guards/release.test.js.
- id: main-is-gated-by-the-host
  title: A project's main branch is gated by its host, or the project has said why not
  status: shipped
  value: A pull request with failing or unfinished checks cannot merge, two pull
    requests that pass alone cannot break the main branch together, and nothing reaches
    it except through a pull request. On 2026-10-30 a pull request merged here with its
    checks still queued, and nothing said so; the host can refuse that, and was not
    asked to. Where the host cannot, the project has said so on record, and every run
    repeats it.
  acceptanceCriteria:
    - Tropis ships a ruleset for the main branch that requires a pull request, a passing
      check and a branch up to date with the main branch, refuses force pushes and
      deletion, and lets nobody bypass it, with one printed command that applies it.
    - A check in the pipeline fails when the main branch requires no pull request or no
      check, or the repository does not allow auto-merge, naming what is missing and how
      to fix it - unless .claude/project.json records why the project is not gated, in
      which case it passes and the run summary carries that reason.
    - Run outside the pipeline, the check says it reads the host from the pipeline and
      passes.
    - Setup and the update ask the developer to apply the ruleset or record a reason,
      and never apply it themselves.
    - Where the main branch is gated, the workflow sends every change through a pull
      request that merges itself once green, dispatch's status change included; where
      it is not, the list of what may go straight to the main branch stands.
    - The workflow says a check that passes on a rerun with nothing changed is a bug to
      record, and that a failed check is never retried automatically.
    - This repository's release tags a commit the main branch already holds and pushes
      nothing to the branch.
  type: feature
  layer: product
  modules:
    - templates/github/main-branch-ruleset.json
    - scripts/pipeline.mjs
    - templates/github/tropis-pipeline.yml
    - scripts/framework-commit-check.sh
    - framework/workflow.md
    - commands/bootstrap.md
    - commands/update.md
    - .github/workflows/ci.yml
    - .github/scripts/release.mjs
  refs:
    - docs/superpowers/plans/2026-10-31-main-is-gated-by-the-host.md
# 2026-10-31, split from main-is-gated-by-the-host. FW-030 has the release pipeline
# commit the version and notes on top of the candidate and merge that into the main
# branch, which a gated branch refuses. Moving that commit into a pull request keeps
# FW-030's promise - nothing merged after the candidate reaches production - by refusing
# instead of by branching. Until this ships, a project whose release pushes to the main
# branch leaves the gate off and records why.
- id: release-tags-what-main-holds
  title: A project's release tags what its main branch holds, so a gated branch needs no bypass
  status: shaped
  value: A project can turn on its host's gate without giving any person or token a way
    around it, because releasing no longer writes to the main branch. Today the release
    pipeline commits the version and the promoted notes and pushes them to the main
    branch itself, so a gated project must either exempt the pipeline or leave the gate
    off.
  acceptanceCriteria:
    - The version and the promoted notes reach the main branch through a pull request,
      drafted by /release once the candidate's check has passed.
    - The release pipeline tags a commit the main branch already holds and pushes only
      the tag.
    - It refuses to tag when anything other than the notes file and the files carrying
      the version changed since the checked candidate, saying a new candidate is needed.
  type: improvement
  layer: product
  after:
    - main-is-gated-by-the-host
  modules: []
  refs: []
