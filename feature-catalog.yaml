# 2026-10-17. The rule sits in three shipped places today: framework/commit-format.md
# ("Never add Co-Authored-By or generated-with trailers"), framework/dispatch.md ("Strip
# tool-injected commit trailers") and framework/workflow.md (the squash-merge note that
# passing --subject and --body removes the trailer).
# Shipped 2026-10-20. The fresh-agent criterion is backed by the check recorded in the
# body of c94c4d1 (Claude Code 2.1.300, dev-laptop.local). The three criteria
# about document text are backed by the searches re-run in the plan's review record.
- id: projects-choose-whether-commits-carry-tool-attribution
  title: The framework no longer makes agents strip the tool's attribution from commits
  status: shipped
  value: A project set up with the framework keeps the attribution its agent tool adds to
    commits and pull requests, such as a Claude or Cursor co-author line or a "made with"
    footer, unless the project itself decides to remove it. Whether to credit the tool
    is the project's choice, and the framework stops imposing one answer on every
    adopter.
  # The squash-merge advice in workflow.md stays: passing --subject and --body still
  # keeps branch working history out of the merged message. Only its trailer reason goes.
  # The Implements trailer read by the release command is unrelated and stays.
  acceptanceCriteria:
    - No shipped framework document, rule, command or template tells an agent to strip,
      avoid or check for co-author, "generated with" or "made with" lines in commits or
      pull requests; a search of the shipped source for those phrases finds nothing that
      instructs it.
    - The workflow document still tells the merger to pass the squash subject and body
      explicitly, with a reason that does not mention tool attribution.
    - A fresh agent committing in a newly set-up project names no project file as the
      source of an instruction to remove or avoid attribution lines; recorded with tool,
      version and machine. Instructions from a user-level file or the tool's own
      defaults are not the framework's and do not count.
    - A project that wants attribution removed can still say so in its own CLAUDE.md, and
      the release notes for the version that ships this tell adopters that the default
      changed and how to keep the old behaviour.
  type: improvement
  layer: product
  modules:
    - framework/commit-format.md
    - framework/dispatch.md
    - framework/workflow.md
  refs:
    - docs/superpowers/plans/2026-10-17-projects-choose-whether-commits-carry-tool-attribution.md

