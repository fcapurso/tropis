- id: tier-picks-are-project-data
  title: A project's model tier picks are its own data, refreshed in a file it owns
  status: shipped
  value: A project dispatches with picks that fit its tools, vendors and budget,
    refreshed when it chooses, and refreshing them never turns its checks red. Today the
