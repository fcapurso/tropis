# 2026-10-31, found reviewing work-that-will-not-be-done-reads-as-closed (its review record,
# Found): a self-check run sat for an hour in a take-version test. take-version.mjs was
# blocked in buildVersion, where spawnSync pipes git archive's output into tar -x: tar had
# read the archive and waited at archive_read_close for the end of its input, and the node
# process never closed the pipe. spawnSync blocks the test worker, so the test's timeout
# never fired. An 11-day-old check-version.mjs test process was stuck on the same machine.
# Why the pipe was never closed is not known. Seen on macOS (Darwin 25.2.0), arm64,
# Node v22.15.0, bsdtar.
# Shaped 2026-11-01. Decided: the cause need not be found. The pipe that hung goes away
# (git archive writes a file in the scratch folder and tar reads that file), and every
# child take-version and check-version start has a time limit, so any other stuck step
# ends in an error that names it. A reproduction would cost more than removing the pipe,
# and a bounded failure that names its step is what someone running an update needs.
# Plan: docs/superpowers/plans/2026-11-01-self-check-red-means-something.md.
# Shipped by docs/superpowers/plans/2026-11-01-self-check-red-means-something.md; each
# criterion's test or check is in that plan's handover report.
- id: an-update-never-hangs-unpacking-a-version
  title: Taking or checking an update never hangs unpacking a version
  status: shipped
  value: Someone taking an update, or checking whether one fits, gets an answer or an error
    in bounded time. Today the step that unpacks a version into a scratch folder can wait
    forever with nothing on the screen, and the framework's own checks that exercise it
    can hang for an hour, because nothing can time them out.
  acceptanceCriteria:
    - Unpacking a version passes nothing through a pipe; git archive writes a file in the
      scratch folder and tar reads it.
    - Every child process take-version and check-version start for the framework's own
      steps is stopped when it runs past a time limit, and the command then refuses,
      naming the step and the limit. The project's own install and test suite, which
      check-version runs in a clone, have no limit.
    - A guard makes tar hang and fails unless take-version refuses within the limit,
      naming the unpacking step.
    - Every guard that runs take-version or check-version gives the child a time limit
      shorter than the test's own, so a hung child fails the test that started it, by
      name.
  type: bug
  layer: product
  modules:
    - scripts/take-version.mjs
    - scripts/check-version.mjs
    - guards/take-version.test.js
    - guards/check-version.test.js
  refs: []
