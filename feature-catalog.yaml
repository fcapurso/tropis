    - docs/superpowers/specs/2026-10-15-framework-name-design.md
# The second of the three, and independent of the first. That one retires rules the code
# can falsify; this one retires rules nothing can falsify — clauses that may simply no
# longer change what an agent does. Only a real trial tells you which, so it is rationed
# to one clause per flush sitting rather than made into a sweep. The sitting already
# exists: /flush-upstream is the moment the framework stops and looks at itself.
# 2026-10-16, backlog cleanup: decided by the developer on the specifying session's advice. A flush
# sitting now happens in a project and reaches this repository as pull requests, so this
# repository never holds one. The trial moves to the framework's own release, the one
# recurring moment it is looked at whole, and a clause removed there goes out in that
# release's notes. After rule-is-measured-with-and-without, so the trial uses a repeatable
# comparison if that spike finds one worth having, rather than being built twice.
- id: rules-are-retired-on-evidence
  title: A rule that no longer changes behaviour is found and removed
  status: shaped
  after:
    - rule-is-measured-with-and-without
  value: A rule stops being carried once there is evidence it is doing nothing.
    At each framework release one clause — from whichever rule file grew most since
    the last release — is put to a fresh agent on a real task with the clause
    removed. If the agent does not trip over it, the clause goes. This is the
    only retirement mechanism that produces evidence rather than a guess, which
    is why it is deliberately rationed to one clause a release and not turned
    into a periodic audit of everything.
  acceptanceCriteria:
    - Someone drafting a release is shown how much each rule file has grown since
      the last release, so the candidate clause is chosen from evidence rather
      than from memory.
    - The trial gives a fresh agent a real task in the area the clause governs,
      with the clause removed — not a conversation about the clause, because
      rules arrive by touching files and an agent that only discusses one never
      receives it.
    - The outcome is recorded whichever way it goes, with what the agent was
      asked and what it did, so a clause that survived is not tried again next
      release and a clause that went can be challenged later.
    - One clause per release, visible from the record — the step does not
      become a sweep.
    - Removing a clause goes the way any rule change goes — on a branch, with
      the fresh-agent check outcome in the commit body. The subtraction step is
      not a second door into the rule files.
  type: improvement
  layer: product
  modules: []
  refs: []
# The third, and the one with real downside risk, which is why it goes last: strip the
# mechanism along with the story and the rules get quietly worse in a way no guard sees.
# After a couple of sittings of the entry above there is evidence about which clauses are
# load-bearing, and the split gets much easier to judge. The test for where the line falls
# is whether removing a sentence would change what an agent does in a case the rule does
# not literally cover — if yes it is mechanism and stays inline. Sometimes the incident is
# the mechanism: the date-formatting clause in tests.md teaches that a bad assertion drags
# production code to meet it, which is a failure mode and not a receipt.
#
# This covers the existing rules, not only the ones written after it — a convention that
# leaves ten files as they are has changed nothing anybody receives. It may well split at
# shaping: the pass over the current rules and the record they point into is one job, and
# the capture question that stops the accretion starting again is another.
- id: rules-carry-mechanism-not-provenance
  title: A rule carries its mechanism; the incident behind it is one link away
  status: shaped
  after:
    - rules-are-retired-on-evidence
  value: An injected rule states the constraint and why it holds, and the
    incident that produced it lives one pointer away in a record nothing
    injects. Provenance persuades a human reading a rule for the first time and
    does nothing for an agent that has already been handed it as an
    instruction, so today it is paying full context cost on every session for a
    job it does once. Nothing is deleted and nothing becomes unrecoverable —
    the record stays reachable on demand, which is the same argument that put
    the rules behind a hook in the first place. It is not the decision log — a
    decision records a choice and its rejected alternatives, an incident
    records what produced a constraint, and collapsing them stops the decision
    log being scannable. The rules that exist today are migrated, not merely
    the ones written afterwards, and the split is held by a fourth question at
    capture time rather than by anyone remembering — otherwise the ten files
    stay as they are and the accretion resumes within weeks.
  acceptanceCriteria:
    - Reading any rule file, each constraint says what it forbids and why that
      holds, and does not retell the occasion it was learned on — except where
      the occasion is itself the mechanism.
    - Every constraint whose incident has moved carries a pointer to it, and
      the incident sits in a record that mirrors the rule file it came from.
    - Following any such pointer reaches a section that exists, and every
      section is pointed at by a rule; a break in either direction fails the
      suite.
    - No record is delivered to a session — none is loaded with any rule, in
      Claude Code or in Cursor, and none of their text appears in a generated
      rule file.
    - Someone editing a rule file is asked at that moment whether what they are
      writing is mechanism or provenance, and where the provenance goes.
    - The clauses left inline because their incident is the mechanism are named
      as such, the date-formatting clause in tests.md among them, so a later
      reader can tell the split was judged rather than applied blindly.
    - What the split bought is recorded — the size of each rule file before and
      after — rather than asserted.
  type: improvement
  layer: product
  modules: []
  refs: []
# Raised 2026-09-12. The first dispatch of ci-deploys-development-on-green emitted a
# header reading "Requires:" with nothing after it — on the one plan in its arc that
# stops for the developer. The plan had written the line as **Requires: the developer …**
# with the bold spanning the phrase; the header parser reads only the form closed right
# after the colon, and emits an empty field rather than refusing.
# 2026-10-15, a second shape: the release plan's Requires field wrapped onto a second
# line, and the kick-off prompt carried only the first, cut mid-sentence ("the gh CLI
# signed in to"), again without a refusal. Unwrapped in d5aa3ba before dispatch; see the
# review record of docs/superpowers/plans/2026-10-15-framework-releases-from-a-green-self-check.md.
# 2026-10-19, shaped from first-adopter's upstream flush (pull request #83, which proposed a
# separate entry dispatch-reads-a-whole-header-field). The maintainer folded it in here,
# so one plan changes the header parser once - reading a wrapped field whole fixes the
# second shape above, and refusing fixes the first.
# 2026-11-01, re-shaped while planning the dispatch-fixes bundle. The plans here write the
# tier and merge fields with the bold spanning the colon, and the parser already reads that
# shape for them, so refusing it for Requires alone would refuse the standard shape; it is
# read like the other two, and only a field that reads empty is refused. The installed
# release still cuts a wrapped field until a release carrying this fix is installed, so
# the entry file's note is reworded to say so rather than removed.
# Plan: docs/superpowers/plans/2026-11-01-dispatch-hands-over-the-whole-plan.md.
# Shipped by docs/superpowers/plans/2026-11-01-dispatch-hands-over-the-whole-plan.md; each
# criterion's test or check is in that plan's handover report.
- id: dispatch-refuses-a-blank-header-field
  title: Dispatch reads each plan header field whole, and refuses one it still cannot read
  status: shipped
  value: A plan's tier, requirements and merge authority reach the kick-off prompt whole,
    or dispatch refuses the plan and names the line. An executor reads the header before
    anything else, and a plan that needs the developer announcing that it needs nothing
    is the worst shape a blank can take. Today scripts/plan-binding.js reads only a
    field's first line, so a wrapped Requires field arrived cut mid-sentence, and a field
    whose bold spans the colon arrives empty; neither is refused.
  acceptanceCriteria:
    - A header field wrapped onto following lines reaches the kick-off prompt whole, up
      to the blank line that ends its paragraph.
    - A header field whose bold spans the colon, such as Requires written the way the
      tier and merge fields are, reaches the kick-off prompt whole.
    - A header field that is present but reads empty is refused at dispatch and by the
      plan check, naming the field and its line.
    - Dispatch tests cover a wrapped field, a bold-spanning field and an empty one, and
      each goes red with the old reading restored.
    - The entry file's note that a plan header field must sit on one line says it holds
      only for the installed release, until a release carrying this fix is installed.
  type: bug
  layer: product
  modules:
    - scripts/plan-binding.js
    - guards/dispatch.test.js
    - framework/dispatch.md
    - commands/dispatch.md
  refs:
    - first-adopter-harness:docs/superpowers/plans/2026-09-11-ci-deploys-development-on-green.md
# Raised 2026-09-12 after the third occurrence in one arc. A colon followed by a space
# inside an unquoted catalog value makes YAML read the rest of the line as a nested
# mapping, and the generator fails with "Nested mappings are not allowed in compact
# mappings" pointing at the value key. Caught instantly, costs a minute each time, and
# the catalog rules say to quote nothing that does not need it without saying this does.
# 2026-11-01, shaped for the rule-text bundle. Checked with the yaml package the guards
# use (2.9): a space then a hash on a value's last line drops the rest of the value
# with no error, which is worse than the colon case because nothing fails; so the rule
# names both, and the value-start characters that fail. The quoting advice itself is in
# commands/idea.md, step 6; the rule loads when feature-catalog.yaml is edited, which
# /idea does, so the rule is the one place this goes.
# Shipped by docs/superpowers/plans/2026-11-01-rule-text-says-what-is-true.md. The
# criteria about rule text are covered by that text and Task 1's checks; the
# fresh-agent criterion by probe C in that plan's handover report.
- id: catalog-rules-name-the-colon-trap
  title: The catalog rules say which characters need quoting
  status: shipped
  value: Someone writing a catalog entry knows before the generator tells them that a
    colon-space inside an unquoted value will not parse, and either rephrases or quotes.
    The rule that says to quote nothing unnecessary is right and incomplete.
  acceptanceCriteria:
    - The catalog rule says that a colon followed by a space inside an unquoted value
      fails the catalog check, and quotes the error it fails with.
    - It says that a space followed by a hash starts a comment that can drop the rest of
      the value with no error.
    - It says that a value beginning with a backtick, a quotation mark or another YAML
      indicator character fails or parses as something else.
    - It says what to do instead, rephrase or put the whole value in double quotes, and
      that these are what needs quoting where the backlog commands say to quote nothing
      that does not need it.
    - The fresh-agent check the workflow requires for a rule change has an agent write an
      entry whose natural wording carries a colon and a space, and records whether the
      entry it commits parses, with tool, version, operating system and architecture.
  type: improvement
  layer: product
  modules:
    - rules/catalogs.md
  refs:
    - docs/superpowers/plans/2026-11-01-rule-text-says-what-is-true.md
