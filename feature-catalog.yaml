# Raised 2026-10-17 in first-adopter and submitted by its upstream flush of 2026-10-19
# (first-adopter:docs/superpowers/plans/2026-10-19-flush-upstream.md). Built there in
# first-adopter-harness bd3ff90 and 11aca02. The sender's view is that it is worth having
# and not urgent; the weight it adds to every project is the maintainer's to weigh.
- id: instruction-files-have-a-delivery-map
  title: Every instruction file says how each tool delivers it, and what that rests on
  status: shaped
  value: Someone adding or changing an instruction file can see, for that file, how each
    agent tool puts it in front of an agent and whether that was measured. Today
    rule-delivery.md explains delivery per tool but cannot answer what a given file
    reaches and whether that was measured, and a new file no tool delivers looks exactly
    like one that works.
  acceptanceCriteria:
    - A map has one row per instruction file - entry files, rules, framework documents,
      commands - with a delivery value per tool from a closed set, and an evidence value
      from a closed set (measured, with tool and version; own side only; unchecked).
    - A check fails when an instruction file has no row, when a row names a file that
      does not exist, or when a value is outside its set.
    - The map lives where an update does not overwrite a project's rows.
    - The check catches a planted missing row in the fixture tree.
  type: feature
  layer: product
  modules: []
  refs: []

# Raised 2026-10-17 in first-adopter and submitted by its upstream flush of 2026-10-19
# (first-adopter:docs/superpowers/plans/2026-10-19-flush-upstream.md). first-adopter keeps its
# own copies of both guards, and its reference scan is red on a fresh checkout for want of
# the second criterion (its framework-suite-passes-on-a-fresh-checkout). Related here -
# integrity-guard-is-green-on-a-fresh-checkout, blueprint-page-checks-run-in-the-self-check.
# Shipped by plan docs/superpowers/plans/2026-10-31-set-up-project-checks-what-its-rules-say.md. Criteria to tests: setup installs both, asserted by
# guards/set-up-project.test.js › sets a project up in its own repository; a fresh project
# passes them before /scope writes the brief, by › a freshly set-up project passes its own
# checks (the backlog board is named in backticks nowhere, so it needs no exemption); the
# currency check leaves an unchanged installed file alone, by the clean baseline's
# fixtures/base/.claude/commands/installed-roster.md, which is stale and fingerprinted;
# planted defects dangling-reference (framework-integrity) and stale-verification and
# stale-picks (doc-currency).
- id: set-up-project-checks-its-pages
  title: A set-up project's checks find pages that point nowhere or assert stale state
  status: shipped
  value: A set-up project's entry file, commands and docs are checked for references
    that point nowhere and for documents past their Last verified date, as Tropis's own
    pages are. Today Tropis runs guards/framework-integrity.test.js and
    guards/doc-currency.test.js on itself and installs neither, so a project's pages can
    point nowhere or assert current state with nothing failing.
  acceptanceCriteria:
    - Setup installs a dangling-reference check and a document-currency check, and the
      project's checks run them.
    - The reference check knows which paths a shipped command creates or a build writes,
      such as docs/project-brief.md from /scope and the generated backlog board, and
      passes on a fresh checkout before they exist.
    - The currency check does not date a fingerprinted framework file, so running a
      shipped command such as /refresh-model-tiers never turns the installed-files check
      red.
    - Each check catches a planted defect in the fixture tree.
  type: improvement
  layer: product
  modules:
    - guards/framework-integrity.test.js
    - guards/doc-currency.test.js
    - scripts/set-up-project.sh
  refs: []

# Raised 2026-10-17 in first-adopter and submitted by its upstream flush of 2026-10-19
# (first-adopter:docs/superpowers/plans/2026-10-19-flush-upstream.md). first-adopter's
# .github/workflows/framework.yml is the GitHub shape. Shaped with the developer to stay
# host-neutral, after project-chooses-its-repository-host, which asks the host at setup.
# 2026-10-22: reshaped with the developer from "run the framework checks in CI" into the
# whole pipeline skeleton, while designing first-adopter's pipeline (the design in refs).
# The deciding is a host-neutral script, so other hosts need only their own wiring; GitHub
# ships first and the order after project-chooses-its-repository-host is dropped, since
# that entry is not needed for GitHub. Built here first, then taken by first-adopter, whose
# holds-tropis-pipeline-skeleton entry waits on this one.
# The GitHub probe runs and the fresh-agent checks are in the handover reports of
# docs/superpowers/plans/2026-10-25-every-project-gets-one-pipeline.md and its
# -review-fixes.md. The first update onto a release offers the pipeline through the
# release notes' by-hand step, because it runs the held release's /update.
- id: setup-offers-ci-for-its-host
  title: Every project gets one pipeline whose stages it fills in, and nothing deploys unless all passed
  status: shipped
  value: A set-up project's checks and deploys run through the same pipeline in every
    project, without anyone remembering to run them. The stages come from Tropis in a
    fixed order and the project says what each runs; a stage the project has not filled
    is empty and passes, and nothing deploys unless every stage passed or was empty.
    Today a set-up project gets no CI at all, so its framework checks run only by hand,
    and a project that writes its own tends to let a deploy wait for some checks and not
    others.
  acceptanceCriteria:
    - The stages, in order, are framework checks, sanity checks, unit and seam tests,
      integration tests, end-to-end tests and deploy. Unit and seam tests run in-process
      with no outside service; integration tests talk to something real outside the code.
    - A host-neutral Tropis script reports which stages a change needs, runs one named
      stage for the project the same way on a developer's machine as in CI, applies the
      deploy gate, and writes a run summary listing every stage as run, empty or skipped.
      Its logic is tested in Tropis's own suite.
    - A change touching only files the project lists as prose and framework files runs
      the framework checks only and deploys nothing.
    - The project fills a stage with a script in a folder Tropis never touches; a stage
      with no script is empty and passes. Tropis's files and the project's never share a
      file, so an update replaces Tropis's part mechanically.
    - The framework-checks stage is a separate Tropis piece that every pipeline calls,
      and a project may add its own checks of framework files to it.
    - On GitHub, a Tropis reusable workflow shows one job per stage, runs stages that do
      not depend on each other side by side once the framework checks passed, and runs
      the deploy job last; a check holds its stage list equal to the script's.
    - A project either follows Tropis's pipeline, where an update brings new stages that
      arrive empty unless they check the framework, or owns a copy Tropis never changes
      again; an update tells an owning project when Tropis's pipeline changed.
    - Setup offers a new project the small workflow file that calls the pipeline, and
      /update offers an existing project the same, listing the steps to adopt it.
    - A release that changes the stage order or the deploy gate is marked breaking.
    - For a host with no wiring file, setup prints the commands to run in the project's
      CI.
    - The workflow document says that where a host marks no check as required, its
      auto-merge merges at once, so a merge waits for the checks to finish green.
  type: improvement
  layer: product
  modules:
    - scripts/pipeline.mjs
    - templates/github/tropis-pipeline.yml
    - templates/github/tropis-framework-checks.yml
    - templates/pipeline-caller.yml
  refs:
    - first-adopter:docs/superpowers/specs/2026-10-22-pipeline-and-environments-design.md
    - docs/superpowers/plans/2026-10-25-every-project-gets-one-pipeline.md

# Raised 2026-10-22 while designing first-adopter's pipeline (the design in refs), where it
# was proven on Forge with a throwaway environment created, deployed, installed,
# uninstalled and deleted by CI's own account. first-adopter's
# holds-tropis-branch-environments entry waits on this one.
# Handover report: docs/superpowers/plans/2026-10-25-a-branch-can-have-its-own-environment.md
- id: deploy-stage-offers-an-environment-per-branch
  title: A branch with an open pull request can have its own environment
  status: shipped
  after:
    - setup-offers-ci-for-its-host
  value: Work in progress can be tried, and several agents can work at once, without
    fighting over one shared development environment. A project whose platform can
    create environments cheaply fills an optional part of the deploy stage, and the
    pipeline then gives each branch with an open pull request an environment of its own
    for as long as the pull request is open.
  acceptanceCriteria:
    - The deploy stage has an optional part the project fills with three scripts, to
      create, deploy to and remove an environment, or leaves empty.
    - Opening a pull request creates its branch's environment, every push whose stages
      all passed deploys to it, and closing the pull request, merged or not, removes it;
      a branch with no pull request gets none.
    - The environment's name comes from the branch by a fixed rule anyone can work out on
      their own machine, so a person or an agent can deploy to it by hand, and two
      branches that would get the same name fail loudly.
    - Two deploys to one environment never run at once; a waiting deploy is replaced by a
      newer one.
    - A push to the main branch deploys to the project's shared development environment,
      not to any branch's environment.
  type: improvement
  layer: product
  modules:
    - scripts/pipeline.mjs
    - templates/github/tropis-pipeline.yml
  refs:
