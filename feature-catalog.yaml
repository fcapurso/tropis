# what an agent receives and what it is refused are backed by the fresh-session
# measurements in the second plan's handover and review record.
- id: framework-is-developed-with-itself
  title: The framework is developed with an installed release of itself
  status: shipped
  value: Someone working on the framework gets the same rules, backlog commands, dispatch
    and checks in the framework repository that a project gets, from the last released
    version installed there, and the framework is its own first customer for setting up
    and updating. Today a session in the framework repository has none of it, so the
    framework's own work borrows a project's tools and its setup is first tried for real
    on somebody else's project.
  acceptanceCriteria:
    - A release is cut only by the release job, after the self-check passes on that
      commit; the job moves the notes' Unreleased section under the new version, tags
      it and pushes, and a failing self-check leaves no tag and no commit.
    - The self-check runs on every push and pull request and fails the run when any
      check fails.
    - The self-check needs no other project; it gets its test tools from what the
      release being built gives a project.
    - The self-check checks the source folders and never the installed copy, with the
      setup's export-ignore lines in place.
    - Release v0.1.0 exists, with notes written for people who set up and run projects.
    - The repository holds v0.1.0 in .claude/ and .framework/, put there by that
      release's own setup script, and the commit that installs it names the release.
    - An agent working on the source scripts and guards receives the framework-script
      rule, and one working on the source rules, framework documents or commands
      receives the learning-capture rule.
    - An agent's attempt to edit the installed rules, framework documents or
      .framework/ is refused.
    - The project's own checks pass in this repository, including the check on the
      backlog's entries.
    - Every place the setup had to be worked around while installing is recorded as a
      finding.
  type: improvement
  layer: product
