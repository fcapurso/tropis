# 2026-10-29, raised by first-adopter's upstream flush, from its queue entry of 2026-10-29.
- id: pipeline-bills-no-job-that-decides-nothing
  title: The pipeline spends no minutes on overhead
  status: shaped
  value: GitHub bills each job by the minute, rounded up, so a job doing seconds of
    deciding costs a full minute on every run. Planning and gating cost two such minutes
    per run, and the candidate's empty stages one each. And every stage job installs its
    dependencies from scratch, so every stage pays the full install time on every run.
  acceptanceCriteria:
    - Planning runs inside the first job that needs it, not in a job of its own, and the
      gate's decision runs inside the deploy job.
    - The candidate workflow starts a stage job only for the stages the project has filled.
    - Every decision is unchanged - the same stages run, are skipped and gate the deploy as
      before - shown by the pipeline's existing guards.
    - Every Tropis workflow job that sets up Node turns on its npm cache, keyed on the lock
      files it installs from, and a run with an unchanged lock file restores from the cache.
    - A job with no lock file to key on runs as today, without failing.
  type: feature
  layer: product
  modules:
    - templates/github/tropis-pipeline.yml
    - templates/github/tropis-candidate.yml
    - templates/github/tropis-framework-checks.yml
  refs: []
# 2026-10-29, raised by first-adopter's upstream flush, from its queue entry of 2026-10-29.
- id: pipeline-does-not-redo-green-work
  title: A tree that already passed is not tested again
  status: shaped
  value: Two common moments re-run every stage on code that already passed - a
    documents-only push to a pull request, and the push to main after a squash merge. Each
    costs minutes, and on a pull request a redeploy of its environment. The release still
    runs the full suite, as FW-030 decides - it is the last check before production.
  acceptanceCriteria:
    - A push to a pull request is planned from that pull request's last green run, so a
      push changing only prose and framework files runs the framework checks alone. With
      no green run it is planned from the whole diff, as today.
    - A push to main whose tree matches a green pull request run skips the stages and
      still deploys.
    - A guard covers each case, the fallback with no green run included.
  type: feature
  layer: product
  modules:
    - templates/github/tropis-pipeline.yml
    - scripts/pipeline.mjs
  refs: []
# 2026-10-29, raised by first-adopter's upstream flush, from its queue entry of 2026-10-29.
- id: release-guides-through-both-steps
  title: A release is two plainly named steps, and /release stays with the developer through both
  status: shaped
  value: Candidate and rehearsal read as jargon, and release names three different
    things. The industry's words, deploy to staging and promote to production, say what
    each step does, and promote names the guarantee that production gets the build that
    was checked. A release with a staging step also takes three commands in the right
    order today, and the developer has to remember the middle one. One command that
    carries them through, and picks up where it left off, removes the step people forget.
  acceptanceCriteria:
    - Every shipped file, command, script argument, workflow and decision record calls the
      two steps deploy to staging and promote to production, with none of the old names
      left except in a migration note.
    - When the project deploys to staging, after the notes are committed, /release shows
      step 1 of 2, deploy to staging, with its trigger, waits for the developer to say it
      has started, then reports the run's summary and its by-hand list.
    - It drafts and records the check with the developer in the same sitting, as
      /manual-check does.
    - On a pass it shows step 2 of 2, promote to production, with its trigger. On a failed
      run or check it records the failure and stops, and running /release again resumes
      from step 1 for the new commit.
    - The developer starts both steps; the command runs neither trigger.
    - Taking the release, a project with a filled pipeline/candidate/ or its caller
      workflow is moved to the new names, or told exactly what to rename, and nothing is
      lost silently.
    - The release-notes line Checked on the release candidate is renamed, and /release
      reads either form during the transition.
  type: feature
  layer: product
  modules:
    - commands/release.md
    - scripts/pipeline.mjs
    - templates/github/tropis-candidate.yml
    - framework/workflow.md
    - framework/DECISIONS.md
  refs: []
# 2026-10-29, raised by first-adopter's upstream flush, from its queue entry of 2026-10-29.
- id: flush-name-is-explained-and-unique
  title: A flush reveals nothing of the project, in the name it goes under or in what it sends
  status: shaped
  after:
    - project-chooses-the-name-it-flushes-under
  value: An operator can flush from a private project without reading every word for
    leaks. Today an operator asked for a flush name learns only that it will be public, so
    they may use the real project name, change it between flushes, or pick one already in
    use - each of which reveals the project or breaks the maintainer's grouping and
    tracking. And a queue entry goes out verbatim, written in the project's own terms.
  acceptanceCriteria:
    - When asking, /flush-upstream says in two sentences what the name is for and that it
      should never change, and the queue header line it writes says the same.
    - It first asks whether the project has flushed before or is already named in the
      framework's records, and proposes that name if so.
    - Otherwise it proposes a generated default, a readable prefix and a short random
      suffix, made with no dependency.
    - Before accepting any name it refuses one under which another account already has
      pull requests on the framework, comparing head branches without the fork owner.
    - /capture-learning, when it routes to the upstream queue, writes the entry in the
      framework's terms - no file, path or name of the project's own, no product or
      customer, and only the figures the point needs - and what it leaves out goes in the
      project's own record.
    - /flush-upstream, for each entry decided flush, shows the text as it will be sent
      with anything of the project's own taken out, the operator approves it, and the
      plan's commit and pull request quote that approved text, not the queue line.
    - Each submission task reads its commit message and pull request body for anything of
      the project's own before pushing, as the exposure check does, and stops for the
      operator if it finds any.
    - The flush command says that a reworded queue entry must be matched in any project
      file that names it by its wording.
    - A guard covers the default name's format and the clash refusal.
  type: feature
  layer: product
  modules:
    - commands/flush-upstream.md
    - commands/capture-learning.md
    - scripts/submit-upstream.sh
  refs: []

