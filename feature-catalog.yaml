# 2026-10-29, raised by first-adopter's upstream flush, from its queue entry of 2026-10-24.
- id: project-settings-are-listed-and-held-once
  title: A project's settings are listed in one place, and one list decides what counts as prose everywhere
  status: shaped
  value: An operator can see every file they own to tailor Tropis, and the two lists that
    decide whether a change needs a pull request can no longer disagree - which today
    leads to a commit warned about wrongly, or a pull request skipped wrongly. A pull
    request of prose and framework files also stops creating a branch environment it can
    never deploy to, which costs minutes and holds one of the hosting platform's limited
    environments for nothing.
  acceptanceCriteria:
    - The operator guide has a section listing each file a project owns to tailor Tropis,
      what reads it, and its format.
    - framework-commit-check.sh decides whether a path may go straight to main from
      pipeline/prose.txt and the pipeline's framework paths, except .claude/, and its
      project-owned block is gone.
    - Taking the release, a project whose block differs from its pipeline/prose.txt is
      told so and which lines differ, and nothing is lost silently.
    - The pipeline's plan and the hook read the same list, so any rule that skips work for
      a prose-and-framework change decides from it too.
    - The README that /refresh-readme commits and the release notes that /release commits
      may still go straight to main, though a check reads them, so the pipeline still runs
      for them. The list says how such a file is told apart from prose, and the operator
      guide says why.
    - branch-create runs only when the plan says the pull request carries more than prose
      and framework files, judged by that same list. The operator guide states the
      trade-off - a pull request that later gains code has no environment, and closing and
      reopening it creates one.
    - A guard shows the hook and the pipeline give the same answer for the same path, and
      covers a prose-only and a code-carrying pull request.
  type: feature
  layer: product
  modules:
