# 2026-10-31, found writing the plan for a-self-merging-pull-request-is-seen-through: two
# sessions worked in this repository's main checkout at once. The board session had its
# branch checked out when the planning session ran git checkout -b, so the plan branch
# started from the board commit. The board session then switched the checkout to main and
# pulled, and the plan commit landed on local main. Nobody lost work, but the first push
# carried the wrong commit, and the repair needed a force-push and a reset of main. The
# workflow isolates only a plan's executor (Branching, "A dispatched agent always works in
# its own worktree"). It assumes one session in the main checkout, and on a gated main
# every change, a backlog edit included, now goes through a branch, so every session
# creates branches there. A rule alone arrives as one more paragraph of Branching, so
# the moment it must reach is the branch-creating command, where the commit hook's
# sibling can speak. The worktree's base is named as origin/main, never HEAD, so a moved
# main checkout cannot choose it. Ordered after the self-merging entry because both edit
# the gated bullet of Branching.
# Shipped by docs/superpowers/plans/2026-10-31-a-session-cannot-move-another-sessions-branch.md.
# Criteria 1 and 4 are covered by release.test.js (the workflow text) and the
# fresh-agent check in the handover. Criteria 2 and 3 are covered by rule-delivery.test.js
# (branch-in-worktree), which runs the hook and the command it prints against real git.
- id: a-session-cannot-move-another-sessions-branch
  title: A session that creates a branch does it in its own worktree, so two sessions in one checkout cannot move each other's work
  status: shipped
  value: Two agent sessions open on one project at the same time each land their own
    change, on the base they meant, with nobody repairing branches afterwards. Today
    both work in the main checkout, so one session's checkout or pull moves the other's
    branch, and a commit lands on the wrong branch or starts from the other session's
    work, with nothing saying so until a push carries the wrong commit.
  acceptanceCriteria:
    - The workflow tells a session that is about to create a branch to create it in a
      sibling worktree of its own, based on origin/main, and leaves the main checkout on
      the main branch, used only to pull and read.
    - When an agent runs a branch-creating command (git checkout -b, git switch -c, git
      branch with a new name) in the main checkout, it is told at that command to use a
      worktree instead, with the command to run, the base origin/main included.
    - The command it is given creates a branch whose base is origin/main even when the
      main checkout has another branch checked out, as a test shows.
    - Once the change has merged, the workflow has the session remove its worktree and
      branch, as the plan merge sequence already does, so worktrees do not pile up.
  type: bug
  layer: product
  after:
    - a-self-merging-pull-request-is-seen-through
  modules:
    - scripts/branch-in-worktree.sh
    - templates/settings.json
    - framework/workflow.md
    - commands/update.md
  refs:
    - docs/superpowers/plans/2026-10-31-a-session-cannot-move-another-sessions-branch.md
# 2026-11-01, found landing release-tags-the-notes-commit (pull request 74): its pipeline
# run 41291063425, on the review-record commit, completed with conclusion success and no
# gate job at all - not skipped, absent - while run 41290753514 on the commit before it
# had its gate pass. The ruleset requires pipeline / gate, so auto-merge waited with the
# pull request BLOCKED and every listed check green; the merge poll ran its 30 minutes
# and nothing said why. One manual re-run of that run scheduled the gate, which passed,
# and the pull request merged as 54e7eda. Cause not known: a GitHub scheduling fault is
# the guess, not tested. The re-run is the kind of retry the workflow says hides
# failures, which is one more reason the state should be named rather than worked round.
- id: a-run-without-its-gate-is-reported
  title: A pull request whose pipeline finished without its required gate check is reported
  status: idea
  value: Whoever is waiting on a pull request's auto-merge learns, with the run's
    address, that its pipeline finished without the gate check the branch requires, and
    so will never merge until something starts the gate. Today the pull request just
    stays blocked with every check it shows green, and a wait on it times out saying
    nothing.
  acceptanceCriteria: []
  type: bug
  layer: product
  modules: []
  refs: []
# Raised 2026-11-01 by the developer, from the rule-text bundle's fix to
# set-up-project-can-generate-its-catalog-document: that fix made the generated catalog
# document conditional, while the board already rebuilds a readable page from the
# backlog (step 1 of /refresh-board, without banding). Set-up projects and this
# repository both ignore docs/backlog-board/index.html.
# Decided with the developer: rebuild without committing, never commit the page, and
# converge any other readable view of the backlog onto the board.
# 2026-11-01, corrected at banding: this repository never committed the page; the claim
# that it did came from misreading a .gitignore line as a tracked file.
- id: board-is-the-backlog-view
  title: The board is every project's readable view of its backlog, and keeps itself current
  status: idea
  value: Anyone who wants to read the backlog opens the board and sees the backlog as it
    stands, because the page rebuilds itself whenever the backlog changes, without
    banding anything and without being committed, so parallel changes to the backlog
    never conflict over it. Every project set up with Tropis gets this one mechanism.
    The backlog rule names the board as the readable view, instead of a generated
    catalog document, and any other mechanism a project already has for the same
    purpose, such as a generated catalog document, is removed in favour of the board.
  acceptanceCriteria: []
  type: improvement
  layer: product
  modules: []
  refs: []
