# 2026-10-15: found in first-adopter. Its 2026-10-14 upstream flush followed
# commands/flush-upstream.md (steps 2 and 4, Global Constraints) and raised two
# capabilities as `layer: blueprint` entries in the application's own catalog, where nothing
# in this repository reads them; they were moved here by hand in 8e80701. The move into one
# repository (first-adopter:docs/superpowers/specs/2026-10-13-project-lives-in-one-repository-design.md,
# step 1) had already put open framework work in this catalog, but the command and
# rules/catalogs.md (## Layers) were not updated, so every project set up from here inherits
# the same instruction. scripts/next.mjs:87 and scripts/next-work.js:91-129 report
# blueprint-layer entries as upstream work; retiring the value touches both.
#
# Shaped with the developer the same day. Decisions, so the plan does not reopen them:
# - One path for everyone. The maintainer flushing from their own project is a contributor
#   like any other; the only difference is where the branch is pushed. A strict "everyone
#   forks" is impossible anyway — GitHub does not let an account fork its own repository.
# - One pull request per queue line, so each suggestion is accepted or declined on its own.
# - A capability arrives as a shaped entry, never an idea: an idea is too vague to review.
#   Accepting one records the work; when it is built stays the maintainer's call.
# - The flush works in a temporary clone of the framework's current main, never in an
#   existing clone; a contributor's fork only receives the branch, so its own state does
#   not matter. `gh` creates or reuses the fork when the submitter cannot push here.
# - The line leaves the project's queue when its pull request opens; the pull request is
#   the record. A declined lesson loses nothing — it is already applied in the project it
#   came from.
# - No GitHub issue is filed by the flush: the pull request already holds the discussion,
#   and a second place would drift. Issues may later be an inbox for people who do not run
#   a flush; that is a repository setting, not this entry.
# - No fallback for submitters without GitHub until one is asked for.
# - The `blueprint` layer value is retired.
# first-adopter's installed copies of the command and rule carry the old text; it takes the
# fix when it takes the next framework version, not by a patch of its own.
# Shipped by plan docs/superpowers/plans/2026-10-15-flush-opens-pull-requests-upstream.md.
# The criteria on asking line by line and on never submitting an unshaped capability rest
# on the fresh-agent check recorded in that plan's review record (Claude Code 2.1.300,
# the developer's Mac) and copied into the merge commit's body.
- id: flush-opens-pull-requests-upstream
  title: A flush reaches the framework as pull requests, the same way for anyone
  status: shipped
  value: Anyone using the framework in a project — its maintainer included — hands what
    that project learned back to the framework the same way. The flush ends with one pull
    request per suggestion against the framework's current main, which the framework's
    maintainer accepts or declines on its own. Today the flush command tells a project to
    edit the framework repository directly, which only its maintainer can do, and to
    record anything that needs building as a blueprint-layer entry in the project's own
    catalog, which nobody working on the framework reads — so that work is recorded and
    never reached.
  acceptanceCriteria:
    - A flush ends with one pull request per queue line it carries, against the
      framework's current main, and does not merge any of them.
    - The command puts the queue to the operator one line at a time, and each line is
      flushed, held or declined by their answer. Only a flushed line gets a pull request;
      a held line stays in the queue; a declined line leaves it with its reason recorded
      in the project's flush plan.
    - A capability is never submitted unshaped. A line that is a capability gets a pull
      request only once its entry has a value and acceptance criteria, written in the
      sitting; until then it stays in the queue, marked as waiting to be shaped.
    - A lesson arrives as the edit it proposes; a capability arrives as a shaped entry
      added to the framework's backlog.
    - The same command opens the pull request whether or not the submitter can push to
      the framework repository; without push access the branch goes to their fork,
      created if they have none.
    - The work is done in a temporary clone of the framework's current main, so neither
      the version installed in the project nor the state of an existing fork or clone
      affects what is submitted.
    - A queue line leaves the project's queue when its pull request opens, and the
      project's flush plan names the pull request each line became.
    - Without the GitHub command-line tool signed in, the command stops before drafting
      anything and says what is missing.
    - The framework's address is read from one place in the project, not written into a
      rule or command.
    - Nothing the framework ships tells a project to raise a blueprint-layer entry; the
      layer value is gone from the catalog rule, the backlog report and the command, and
      the catalog rule tells a project still holding such entries what to do with them.
  type: bug
  layer: product
  modules:
    - scripts/submit-upstream.sh
    - commands/flush-upstream.md
    - rules/catalogs.md
    - scripts/next-work.js
    - scripts/next.mjs
  refs:
    - docs/superpowers/plans/2026-10-15-flush-opens-pull-requests-upstream.md
    - commands/flush-upstream.md
    - rules/catalogs.md
    - scripts/next.mjs
    - scripts/next-work.js
    - first-adopter:docs/superpowers/plans/2026-10-14-flush-upstream.md
    - first-adopter:docs/superpowers/specs/2026-10-13-project-lives-in-one-repository-design.md
# Raised 2026-10-15 by the developer, after flush-opens-pull-requests-upstream shipped:
# contributions now arrive as pull requests, one per flushed line, and nothing at the
# repository root tells a contributor how that works. The developer asked for the page
# to be kept current whenever the contribution mechanisms change, not written once.
# 2026-10-15, shaped. Named CONTRIBUTING.md, by the developer, because GitHub links only
# that name from a new pull request — where someone arriving through a flush will be. It
# covers both ways in: a flush from a project, and a change made in this repository
# directly. README.md and bootstrap.md keep a sentence each and point at it, so the
# mechanism is described in one place. Kept current the way the operator and adopter
# pages are (FW-006): a doc-closeout row, plus a check for what can be checked.
- id: contributors-know-how-to-contribute
  title: A contributor can read how contributing to the framework works
  status: shaped
  value: Someone who wants to hand an improvement back to the framework — from a project
    using it, or directly — finds one page at the repository root, CONTRIBUTING.md, that
    says how a contribution reaches the framework and what happens to it, without reading
    the commands and rules that implement it. The page stays true because it is updated
    whenever a contribution mechanism changes, rather than drifting the way a page written
    once does.
  acceptanceCriteria:
    - CONTRIBUTING.md at the repository root tells someone in a project using the
      framework how a lesson or a capability reaches it — the upstream queue, the
      /flush-upstream sitting where each line is decided, one pull request per line to
      the framework or to their fork — what they need for it, and what happens to the
      pull request once it is open.
    - It tells someone changing the framework in this repository the path a change takes —
      a plan, a branch, the self-check, a fresh-agent check for a rule or framework
      document, review, a squash-merge — by pointing at the framework documents that say
      it, not by restating them.
    - It says what does not work yet, as it stands when written — today, that a pull
      request from a fork gets no CI run.
    - README.md and bootstrap.md each point at CONTRIBUTING.md and no longer describe the
      contribution mechanism themselves beyond a sentence.
    - The doc-closeout table has a row saying that a change to how a contribution reaches
      the framework updates CONTRIBUTING.md in the same plan.
    - A check fails when CONTRIBUTING.md names a command, script or file that does not
      exist.
    - CONTRIBUTING.md is not copied into a project set up from the framework.
  type: feature
  layer: product
  modules: []
  refs:
    - docs/superpowers/plans/2026-10-15-flush-opens-pull-requests-upstream.md
    - docs/superpowers/plans/2026-10-15-contributors-know-how-to-contribute.md
