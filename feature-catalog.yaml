- id: rule-areas-are-project-data
  title: A project's rule areas live in its own file, read by every tool
  status: shipped
  value: A project declares the areas of the framework's shipped rules in one file of its
    own, and the files each tool loads for those rules are generated from it — a paths
    header for Claude Code, a Cursor rule in the form measured to reach a Cursor agent.
    So taking a new framework version never overwrites a project's areas, and the tools
    cannot disagree. Today a project changes a shipped rule's area by editing that rule's
    header, which the next version would overwrite, and the Cursor rules the framework
    generates reach no agent.
  acceptanceCriteria:
    - A newly set-up project declares each shipped rule's areas in .claude/rule-areas.json;
      no shipped file carries a project's paths, and changing a shipped rule's area edits
      only that file.
    - One framework command writes each shipped rule's Claude Code file — its text with a
      paths header from the areas file — and every rule's Cursor file in the form the
      Cursor measurement found delivering (alwaysApply false, a description, unquoted
      globs separated by a comma and a space), and writes nothing else; run twice, it
      writes identical files.
    - A project's own rules stay hand-written in .claude/rules/ with their own header; the
      command leaves them as they are and writes their Cursor files.
    - Each generated file carries a content hash, and a check mode lists every generated
      file that differs from what the sources would write, a hand-edited one included,
      and exits non-zero; the project's checks run it.
    - Shipped rule texts live in .framework/rules/, where a new framework version
      replaces them, and nothing a project chose is written in them.
    - A fresh Claude Code session in a newly set-up project receives no area rule before
      touching a file, and an area's rule and no other once it reads a file there.
    - A Cursor agent in a newly set-up project receives a generated rule when it reads a
      file in its area, a rule whose area is one file at the root and one whose globs
      begin with * included — checked by the developer in Cursor and recorded in
      docs/verification-log.md.
    - The framework's pages, rules and commands tell an agent where a shipped rule's area
      is changed and to run the command after changing any rule; nothing tells a project
      to edit a shipped rule's header.
    - A project set up before this keeps its layout until project-takes-a-framework-version
      moves it, and that entry says so.
  type: improvement
  layer: product
