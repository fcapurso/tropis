# "A rule that says the code is a certain way is asserted" in rules/learnings.md, checked
# by the fresh-agent check in the plan's handover report, Verification results.
- id: rule-claims-are-held-true
  title: A rule's claims about the code are asserted, and a clause waiting on a fix retires with it
  status: shipped
  value: In a set-up project, a rule that says the code is a certain way carries an
    assertion, and a clause that exists only because the code is still wrong names the
    entry it waits on and the assertion behind it, so it is deleted when the defect is
    fixed instead of being obeyed after it stops being true. Today Tropis ships
    templates/rule-claims.test.js, but setup does not install it and the learnings rule
    never mentions it, and nothing pairs a temporary clause with what retires it.
  acceptanceCriteria:
    - Setup installs the rule-claims check, and the learnings rule says that a rule
      claiming the code is a certain way gets an assertion in it, or a place on its
      untestable list with the reason.
    - A rule clause marked as temporary names a catalog entry that exists and an
      assertion that exists, and that assertion names the clause back; a check fails
      when either half is missing.
    - When such an assertion goes red, its failure names the rule file and the paragraph
      to delete.
    - The learnings rule says when to write a temporary clause and gives its marker,
      in the form first-adopter uses - "Temporary — until <id>. Asserted by <test> › <name>."
    - Each check catches a planted defect in the fixture tree.
  type: improvement
  layer: product
  modules:
