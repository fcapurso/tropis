# 2026-10-16, raised by the developer after comparing this framework's /release with
# first-adopter's: about four of first-adopter's differences are values a project-owned block
# holds, about five are instructions woven into the stages. The idea to test: each command
# keeps a fixed skeleton and offers named slots a project fills; an update replaces the
# skeleton and carries each slot by name. Planned now, to run after the update command
# ships; the developer wants to see the first switch to an installable framework before
# building anything from it.
# 2026-10-16, backlog cleanup: added to the updates arc, whose goal is that a project's own changes
# live where an update never has to merge them; commands are the part not yet there.
- id: command-slots-spike
  title: Find out whether commands can be extended through fixed slots and still update mechanically
  status: shaped
  value: Before changing how projects customise the framework's commands, we know from
    what real projects changed whether a fixed skeleton with named slots holds those
    changes, whether an update can then carry them across versions without a hand merge,
    and what adopters would lose. Today a project that changes a command outside its one
    block forks it, and every later improvement to that command reaches the project only
    as a .new file to merge by hand.
  acceptanceCriteria:
    - A written finding classifies every change that first-adopter, expense-tracker and this
      repository's installed copy made to the framework's commands as a value, behaviour at
      a point in the procedure, a change to the procedure itself, a fix the framework
      should take, or a stale copy, each with the diff it came from.
    - For each shipped command, the finding proposes the fixed procedure and the named slots
      with what each slot is for, and says how many of the real changes those slots hold.
    - A throwaway prototype, run on first-adopter's release command rewritten into slots,
      shows an update carrying slots by name, listing a removed slot, listing a slot whose
      purpose changed, and surviving a stage added upstream, with its output in the finding.
    - A fresh agent following the slotted release command does on a stated task what
      first-adopter's own command makes it do, recorded with tool, version and machine.
    - The finding says whether a fixed procedure limits adopters, naming every change to a
      procedure found and what a project would do instead, and recommends the balance
      between stability and customisation, with the entries to build.
  type: spike
  layer: product
  modules: []
  refs:
    - docs/superpowers/specs/2026-10-09-framework-updates-like-a-dependency-design.md

