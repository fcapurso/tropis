- id: flush-is-seen-to-drain-the-queue
  title: A check fails when an executed flush left the queue undrained
  status: shipped
  value: A project whose flush plan ran but whose queue was never drained is told so by
    its own checks, with the file to edit and the date to set. Today the drain is a task
    in the flush plan and nothing observes whether it ran; in one project a flush merged
    with every line still queued, and the backlog report went on advertising a flush
    that had happened.
