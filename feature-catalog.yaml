- id: product-readme-is-kept-current
  title: A product's README stays current without every plan patching it
  status: shipped
  after:
    - framework-is-developed-with-itself
  value: Someone who has just found a project — any project set up with Tropis, and Tropis
    itself — reads a README that is complete, correct and readable, because it is refreshed
    as a whole page from what the project records, someone is told when it has fallen behind,
    and every release refreshes it first. A project can also take the README over entirely.
    Before, nothing kept it current; it was right only if someone remembered.
  acceptanceCriteria:
    - At the writes level, /refresh-readme rewrites the out-of-date sections of README.md
      from the project's skeleton, lists each changed section with its reason, and commits
      only on the developer's yes; on a no the page is exactly as before.
    - At the suggests level, or with no level chosen, /refresh-readme reports what is
      missing or out of date and leaves README.md unchanged. At the manual level, Tropis
      runs no check, nudge or release step about the README, and /refresh-readme run by
      hand only reports.
    - A project without its own skeleton is refreshed from the one Tropis ships; a project
      with its own copy is refreshed from that copy, and updates never change it.
    - /bootstrap asks which level the project wants, /refresh-readme with a level records
      it, and the first update after this release asks an existing project once.
    - At the writes or suggests level, /next and the backlog board say when the README was
      last refreshed and name the shipped product features and improvements since, and say
      nothing when there are none.
    - At the writes or suggests level, /release refreshes the README before drafting the
      notes, and when the README is still behind it lists what and asks whether to release
      anyway.
    - Tropis has its own skeleton, carrying the story of its name word for word, at the
      writes level, and its workflow tells plans not to patch the README.
  type: improvement
