# Raised 2026-10-22 while designing first-adopter's pipeline (the design in refs). /release
# already asks whether the output was checked on the release candidate, but nothing says
# where that check happens. first-adopter's holds-tropis-release-candidate entry waits on
# this one.
# 2026-10-26, criteria 2 and 3 reworded while planning
# (docs/superpowers/plans/2026-10-26-release-is-rehearsed-on-a-candidate.md). The tagged
# commit must carry the promoted notes and the version, which are set only once the
# candidate passed, so the tag sits one commit above the candidate with the same code. And
# the check's outcome cannot be written into the candidate's notes after the check, so the
# check is recorded in the verification log and the release step writes the line.
# Handover report: docs/superpowers/plans/2026-10-26-release-is-rehearsed-on-a-candidate.md
- id: release-is-rehearsed-on-a-candidate
  title: A release is rehearsed on a candidate before it is tagged
  status: shipped
  after:
    - setup-offers-ci-for-its-host
  value: What users will get is tried first on a pre-production copy, through the same
    upgrade production will go through, and only a candidate that passed there becomes a
    release. Production then ships exactly the commit that was checked, never whatever is
    on the main branch when someone starts it.
  acceptanceCriteria:
    - The workflow document's release section and /release describe two steps the
      developer starts. A release-candidate step, for a chosen commit, runs every stage,
      puts the pre-production environment back on the version production runs, deploys
      the candidate, and says whether anything must be upgraded by hand. It sets no
      version and makes no tag.
    - The check on the candidate is drafted and recorded through /manual-check, and
      /release prints the release trigger only once that entry is recorded pass.
    - The release step, started once that check is green and given the candidate's
      commit, sets the version and promotes the notes in one commit on top of the
      candidate that changes nothing else, tags a commit whose code is therefore the
      candidate's, and deploys it to production; nothing merged after the candidate
      reaches production through it.
    - The project fills the reset and deploy of its pre-production environment, or leaves
      them empty, and /release then says no candidate was rehearsed.
  type: improvement
  layer: product
  modules:
    - scripts/pipeline.mjs
    - templates/github/tropis-candidate.yml
    - commands/release.md
  refs:
    - first-adopter:docs/superpowers/specs/2026-10-22-pipeline-and-environments-design.md

