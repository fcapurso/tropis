# 2026-10-15: the name is agreed — Tropis (Ancient Greek τρόπις, a ship's keel: laid
# first, and everything else built along it). Chosen by the developer from a search for
# short names in several languages with the spirit of keel or trellis. Checked that day
# against GitHub repository names, npm and the web: no software uses the exact name;
# nearest are Tropir (AI observability) and Tropic (procurement). Trademark registers were
# not searched. Ruled out on the way: Carina, Pergula, Ordito, Charax, Squadra, Waku (each
# taken by a developer or AI tool), Gnomon, Kanon, Kata, Stoa, Sutra (crowded). The
# developer also asked for a short story in README.md telling how the framework helps and
# what the name means; the developer approved its text the same day, and it lands with
# this entry's plan, word for word, from docs/superpowers/specs/2026-10-15-framework-name-design.md.
# 2026-10-15, shaped. The developer decided the folder a project holds the framework in
# keeps its name here: .framework/ becomes .tropis/ in project-takes-a-framework-version,
# whose first run does the move, so neither installed project (this repository,
# first-adopter) migrates by hand and the folder has its final name before anything is
# fingerprinted. The command keeps its shape until then too; the package's own command
# arrives with framework-installs-as-a-package.
# Shipped by plan docs/superpowers/plans/2026-10-15-blueprint-tool-agnostic-name.md. The
# repository criterion rests on the plan's Task 1 check and its review record (the old
# address answered git ls-remote through GitHub's redirect); the rest on its Task 2 and 3
# checks, re-run in review.
# Ordered after blueprint-readme-usable in first-adopter-harness's catalog, from before the framework moved here.
- id: blueprint-tool-agnostic-name
  title: Name the blueprint for what it is, not one agent tool
  status: shipped
  value: Someone cloning or linking the blueprint sees a name that matches its
    claim — a governance layer for agent-assisted projects, not a Claude-only
    product. Today the repository is still claude-project-framework while the
    README (after Plan A) already describes Claude Code and Cursor as supported
    tools. The mismatch teaches the wrong story at the URL even when the page
    voice is fixed. The name is agreed — Tropis — and the repository and every page
    where the framework names itself take it, with the README telling in a few lines
    what the name means and how the framework helps.
  acceptanceCriteria:
    - The framework's GitHub repository is fcapurso/tropis, and the old address still
      reaches it.
    - README.md is titled Tropis and carries the section What is Tropis? word for word
      from docs/superpowers/specs/2026-10-15-framework-name-design.md, directly under
      its opening paragraph.
    - Wherever the framework names itself — the README, the operator page every set-up
      project gets, and this repository's entry files — it is called Tropis, not the
      project governance framework.
    - The next release's notes say the framework is now called Tropis and where it
      lives, and that nothing in a set-up project moves.
    - The folder a project holds the framework in keeps its name, and the entry that
      renames it says so.
  type: chore
  layer: product
  modules: []
  refs:
