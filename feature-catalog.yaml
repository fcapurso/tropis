- id: project-is-set-up-in-its-own-repository
  title: The framework sets up a project inside its own repository
  status: shipped
  value: Someone starting a project with the framework gets it set up inside the project's
    own repository — rules, commands and hook wiring in .claude/, the framework's code in
    .framework/ — and every session starts there. Today the blueprint seeds a sibling
    harness repository, links or copies an overlay into the application and sets up two
    checkouts, the layout first-adopter left on 2026-10-13 because every crossing between
    the two needed its own measured workaround.
  acceptanceCriteria:
    - Setting up a project copies the framework into its .claude/ and .framework/, and
      every command the framework offers runs from an entry point under .framework/.
    - No sibling repository, overlay or second checkout is created; seed-sidecar.sh,
      install-overlay.sh and setup-working-copy.sh are gone, and bootstrap describes no
      sibling repository.
    - Dispatch and worktree isolation work on one repository.
    - A set-up project gets its Cursor rule projection.
    - Every rule a set-up project receives opens with a paths header naming the files it
      governs, and the project's checks fail when a rule lacks the header.
    - An exported copy of a set-up project contains none of the tooling.
