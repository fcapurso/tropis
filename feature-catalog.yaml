# The spike measured the hook and the projection output; it could not ask a Cursor agent
# from inside, and did not test precedence under a genuine conflict. Both belong in the
# criteria when this is shaped.
# 2026-10-15, shaped with the developer. Rules only: a project's additions to a framework
# document need no mechanism, because the project's own CLAUDE.md already holds them and
# every session loads it — the pages say so, and harness-adopts-the-update-model is where
# first-adopter's workflow additions move there. Commands are out too: they already carry
# project-owned regions. The additions live in .claude/rule-additions/, not beside the
# rule in .claude/rules/, because Claude Code loads every file there and one with no
# header in every session. The generator joins them after the shipped text — the
# rule-tooling finding found no tool that does. Where the two contradict, the project's
# additions win (the developer's ruling; the behaviour measured once in the update-model
# spike), and because a conflict cannot be detected mechanically the separator itself
# tells the agent to say so to the operator when it follows an addition over a shipped
# clause. A project's own rules get no additions file: the project already owns them.
# Shipped by plan docs/superpowers/plans/2026-10-15-shipped-rules-have-project-companions.md.
# The two Claude Code criteria rest on the plan's Task 6, recorded in its handover and in
# framework/rule-delivery.md (Claude Code 2.1.300); the Cursor criterion is the
# verification-log entry of 2026-10-15 (pass, Cursor 3.24.12); the pages criterion also
# rests on the fresh-agent check in the body of the branch commit recording the Cursor check.
- id: shipped-rules-have-project-companions
  title: A project adds to a shipped rule in its own file
  status: shipped
  after:
    - rule-areas-are-project-data
  value: A project adds its own clauses to a shipped rule in a file of its own, and the
    rules command joins them after the shipped text in the one file each tool loads, so
    an agent receives them as one rule. The project's additions win where the two
    contradict, and an agent that follows one over a shipped clause says so to the
    operator. So a project's additions survive a new framework version untouched, and a
    framework lesson is never dropped silently. Today a project edits the shipped rule,
    and every update has to merge those edits by hand.
  acceptanceCriteria:
    - A project adds to a shipped rule by writing .claude/rule-additions/<name>.md, plain
      text with no header; nothing in .framework/ changes.
    - The rules command writes, for a shipped rule with additions, one Claude Code file and
      one Cursor file holding the shipped text, a fixed separator, then the additions; no
      second rule file is written, and a rule without additions comes out byte for byte as
      before.
    - The separator says that the text after it is this project's additions to the rule,
      that they win where they contradict the text above, and that an agent following one
      over a shipped clause it contradicts tells the operator so.
    - The command refuses, writing nothing, an additions file named for no shipped rule and
      one that carries a paths header, and says what to do about each.
    - The check mode reports a generated rule as stale once its additions change, and the
      plan checks refuse a plan that lists an additions file without the two files written
      from it.
    - Setting a project up writes nothing in .claude/rule-additions/, and replacing the
      shipped rule texts and regenerating leaves that folder unchanged; a guard proves it.
    - A fresh Claude Code session in a newly set-up project with an additions file receives
      neither the shipped text nor the additions before touching a file in the area, and
      both once it reads one.
    - Given an addition that contradicts a shipped clause, a fresh Claude Code session doing
      a task that clause governs follows the addition and tells the operator it did so over
      the shipped clause.
    - A Cursor agent that reads a file in the area receives both texts, and with the
      contradicting addition follows it and says so — checked by the developer in Cursor
      and recorded in docs/verification-log.md.
    - The framework's pages say where a project's additions to a shipped rule go, and that
      its additions to a framework document go in its own CLAUDE.md; nothing tells a
      project to edit a shipped rule's text.
  type: feature
  layer: product
  modules:
    - scripts/generate-rules.mjs
    - scripts/rule-areas.js
    - scripts/projections.js
    - guards/rules-generated.test.js
    - guards/rule-additions.test.js
