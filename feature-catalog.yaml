  status: shaped
  shelved: true
  after:
    - project-is-set-up-in-its-own-repository
  value: Shelved 2026-10-16 because the framework is distributed as a Node package
    (framework-installs-as-a-package) and every program it runs is Node. Reopen if an
    adopter who cannot install Node asks for it. Someone adopting the framework can track work, read the backlog, and run
    the framework's checks on a machine that has git, bash, and python3, without
