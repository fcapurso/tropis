# against .tropis/; the display name had been given .tropis/project.json on 2026-10-17. The
# developer chose .tropis/ as the one home: .claude/ is named after one agent tool, and
# these settings belong to the project whatever tool it uses.
- id: project-settings-live-under-tropis
  title: A project's own settings and data live under .tropis/, in one place
  status: idea
  value: Someone tailoring a project finds every setting the project owns in one file
    under .tropis/, the framework's own folder, rather than split between it and the
    folder one agent tool reads. Today whether the project is public and why its main
    branch is not gated sit in .claude/project.json, while its display name is planned
    for .tropis/project.json, so a project would keep two settings files in two folders,
    and settings that apply to every agent tool sit in a folder named after one. The move
    covers .claude/project.json, and every other file of the project's own under .claude/
    is looked at - the rule areas, the additions to shipped rules, the project's own
    rules and its share of settings.json among them - to decide whether it moves too or
    stays because a tool reads it only from there.
  acceptanceCriteria: []
  type: improvement
  layer: product
  modules: []
  refs: []
# Raised 2026-10-17. Today /bootstrap requires the project folder to already be a git
# repository and never touches a remote, so the developer creates the GitHub repository and
# picks its name before setup, unconnected to the display name. Creating a remote repository
# is outward-facing and hard to undo, so whether the framework should do it at all is part
# of the idea.
- id: setup-offers-to-create-the-repository
  title: The setup offers to create the project's GitHub repository
  status: idea
  value: Someone starting a project from nothing can have the setup create its GitHub
    repository, with a name suggested from the project's display name and confirmed before
    anything is created, instead of having to make the repository by hand first and choose
    its name with nothing to go on.
  acceptanceCriteria: []
  type: feature
  layer: product
  modules: []
  refs: []
# Raised and shaped 2026-10-17. Git stays a hard prerequisite; the host of the project's
# origin is the project's choice. Three places assume GitHub through the gh tool:
# framework/workflow.md's merge sequence (gh pr merge), the merge-time hook
# (scripts/capture-at-merge.sh:31, wired in templates/settings.json with
# "if": "Bash(gh pr merge *)"), and commands/next.md's `gh pr list --state open`. Two are
# fixed by keying on git; only the merge command itself is host-specific, because a squash
# merge of a pull request happens on the host — Bitbucket has no first-party command-line
# tool, so its slot may read "merge on the website". The hook moves to a git step the merge
# sequence already runs before the merge (`git worktree remove` of the plan worktree, or
# `git branch -D plan/...`), so it also fires where the merge happens in a browser. Sending
# changes back to the framework (/flush-upstream, submit-upstream.sh) stays on gh: it targets
# the framework's own repository, which is on GitHub, not the project's host. Matching the
# new trigger at command position is hooks-match-at-command-position's rule; do both
# hooks the same way.
# 2026-10-22, from the developer: this entry also brings the pipeline's wiring to other
# hosts, and at planning time sweeps everything Tropis then ships that leans on GitHub.
- id: project-chooses-its-repository-host
  title: A project can keep its repository on any git host
  status: shaped
  value: Someone whose project lives on GitLab, Bitbucket or any other git host gets the
    whole workflow, not most of it. Today the merge steps are written for GitHub's
    command-line tool, the reminder that asks what a plan taught and demands its review record
    before the merge fires only on GitHub's merge command — so on any other host it never
    fires and says nothing — and the backlog report's list of work in flight comes from
    GitHub. Git is required; where the origin is hosted is the project's choice.
  acceptanceCriteria:
    - The setup asks where the project's repository is hosted and records the project's
      merge command from the answer; GitHub's is the default, and a host with no
      command-line tool gets an instruction to merge on the website.
    - The workflow document describes the merge step without naming a host — squash-merge
      the pull or merge request with an explicit subject and body, then delete the remote
      branch — and the command itself sits in a block the project owns, kept across
      updates.
    - The merge-time reminder fires on a git step the merge sequence runs before the
      merge, so it fires on every host, including one where the merge happens in a
      browser; a test shows it firing with no gh installed, and going quiet with the
      trigger reverted.
    - The backlog report lists work in flight from the remote's unmerged plan branches
      using git alone, and runs with no host tool installed.
    - The prerequisite check requires git and no longer warns about gh for the merge
      steps; gh is named only by the commands that send changes back to the framework.
    - A check fails when shipped source outside those commands and the default merge
      block names gh.
    - The pipeline from setup-offers-ci-for-its-host gets a wiring file for each host this
      entry supports, mapping the stages to that host's jobs, and setup offers the one for
      the project's host.
    - When this entry is planned, everything Tropis then ships that depends on GitHub is
      listed, and each item is either made host-neutral or supported on at least two
      hosts; none is left GitHub-only without the plan saying why.
  type: feature
  layer: product
  modules: []
  refs: []
# Raised 2026-10-18 by the developer, while bundling first-adopter's upstream queue: a flush
# sends one pull request per queue entry, and grouping them for review was first proposed on
# the sending side; the developer pointed out that how to review is the receiving
# maintainer's decision, not the sender's. first-adopter's queue meanwhile holds 38 entries
# (first-adopter docs/BLUEPRINT-UPSTREAM.md, 0e53c01), so the receiving side is where the
# effort lands. One group absorbed by one plan lands as one squash-merge.
# 2026-10-19, by the maintainer while absorbing first-adopter's flush: a group lands as one
# pull request that keeps one commit per contribution, by rebase, not as one squash. The
# squash rule exists because a plan's branch serves one entry, and a group of flushed
# contributions is many things. Groups 1 and 2 of that flush were squashed first and then
# rebuilt on main the same way. The finding in refs proposes acceptance criteria.
# Shaped 2026-10-19 from the finding's proposed criteria. The maintainer decided that the
# command lives in this repository only, proposes groups for the maintainer to confirm, and
# closes an absorbed pull request only once the commit carrying it has landed.
# Shipped 2026-10-19 by plan 2026-10-19-maintainer-absorbs-contributions-in-groups. Criteria
# 2, 6, 7 and 8 rest partly on the fresh-agent check recorded in commit ea87516 (Claude Code
# 2.1.300, the developer's Mac). Not yet run on a real flush; the first one is the owed observation.
- id: maintainer-absorbs-contributions-in-groups
  title: The maintainer takes incoming contributions in groups, one pull request and one merge each
  status: shipped
  value: The maintainer facing many pull requests from projects' flushes sees them grouped
    by what they change in the framework, and decides each group at once — merge a small
    one that stands alone as it is, absorb a group into one pull request that keeps one
    commit per contribution (the contributor's own commit, author and message, with a line
    saying what changed in absorbing it) and lands by rebase rather than squash, so history
    shows each contribution and each can be reverted alone, or decline with the reason.
    Where two contributions edit the same lines, they are applied in a fixed order and the
    later one's commit carries the resolution and says so; two that cannot both stand are
    decided by the maintainer before combining. Each absorbed pull request is closed with
    a comment naming the commit on the main branch that carries it, written once that
    commit has landed; a declined one says why. A plan for a single catalog entry still
    lands as one squash-merge. Today every flushed entry arrives as its own pull request
    and nothing helps the maintainer see which belong together, so reviewing a large flush
    means many separate reviews and many merges for what is really a few changes.
  acceptanceCriteria:
    - A command in this repository, which no release installs into a project, lists a
      flush's open pull requests with the files each changes, proposes groups by file, and
      flags each pull request that spans groups and each pair that edits the same lines.
      The maintainer can move a pull request between groups before deciding. Run again
      mid-review, it says which pull requests arrived since the last listing.
    - For each group it shows every contribution with a recommendation. A judgment call is
      shown with its impact, pros and cons, and a recommendation that rests on how the code
      behaves names the code that was read to check it.
    - For a decided group it builds one branch with one commit per accepted contribution,
      the contributor's commit re-applied with its author, date and message, plus a line
      naming the pull request and what changed in absorbing it.
    - Contributions apply in pull-request order, and a conflict is resolved in the later
      commit, whose message says so. A catalog entry appended at the end goes on verbatim,
      and only after a check that the contributor's catalog begins byte-for-byte with the
      base; no line-union merge is used.
    - Rewrapping changes only the items a contribution touched, and a test shows front
      matter, numbered steps, tables, fenced code and arrow lines left as they are.
    - Before asking to merge, it shows the full diff and the results of the framework's
      self-check and the project's checks, both run on the exact head commit. It pushes
      only in a step after the maintainer says yes, never in the step that asks.
    - It merges by rebase only after the maintainer says so, and never pushes to the main
      branch directly.
    - Once the merge has landed, it closes each absorbed pull request with a comment naming
      the commit on the main branch that carries it, closes each declined one with the
      reason, and lists the branches left to delete.
    - The workflow says a plan for one catalog entry lands as one squash-merge and a group
      of flushed contributions lands by rebase with one commit per contribution, and the
      decision record says why.
  type: feature
  layer: product
  modules:
    - .github/scripts/absorb-flush.mjs
    - .claude/commands/absorb-flush.md
    - guards/absorb-flush.test.js
  refs:
    - docs/superpowers/specs/2026-10-19-absorbing-a-flush-finding.md
    - docs/superpowers/plans/2026-10-19-maintainer-absorbs-contributions-in-groups.md

# Raised 2026-10-17 in first-adopter (its FW-005 and FW-007, and e463f2c) and submitted by
# its upstream flush of 2026-10-19 (first-adopter:docs/superpowers/plans/2026-10-19-flush-upstream.md).
# Each half alone leaves one kind of work invisible, so they are one entry.
# 2026-11-01, checked against the report while planning the next-report bundle; the
# criteria stand. Plan: docs/superpowers/plans/2026-11-01-next-report-shows-all-open-work.md.
# Shipped by docs/superpowers/plans/2026-11-01-next-report-shows-all-open-work.md; each
# criterion's test is in that plan's handover report.
- id: next-lets-no-open-work-drop-out
  title: The backlog report shows each layer as its own stream, and names the work bands would hide
  status: shipped
  value: Someone reading the backlog report sees the next step for product work and for
    framework work, and still sees an unblocked idea worth shaping and an arc that lost
    its turn. Today one mixed list lets one layer's next step hide the other's, and once
    bands decide what is suggested, a band A or B idea that needs shaping and a
    half-finished arc drop out of the report without a word.
  acceptanceCriteria:
    - The report prints a product stream and a framework stream, each with its own next
      step, suggested action, Ready list and Blocked list; a layer with no entries prints
      its heading and (none).
    - Ready and blocked are worked out from the whole catalog before entries are kept by
      layer, so a product entry blocked by a framework entry shows as blocked.
    - Arcs under way are printed after both streams.
    - With bands, the report lists band A and B ideas that are not blocked as work to
      shape.
    - With bands, the report names each arc under way whose next step lost to a higher
      band.
    - Without bands, the report prints both streams and nothing about shaping or lost
      turns.
    - guards/next-report.test.js covers each criterion.
  type: improvement
  layer: product
  modules:
    - scripts/next.mjs
    - scripts/next-work.js
    - guards/next-report.test.js
  refs: []

# Raised 2026-10-17 in first-adopter and submitted by its upstream flush of 2026-10-19
# (first-adopter:docs/superpowers/plans/2026-10-19-flush-upstream.md). first-adopter carries
# the instruction by hand, in its CLAUDE.md under "Dispatching a plan".
# 2026-11-01, re-shaped while planning the dispatch-fixes bundle. The step counts the
# checkouts the plan isolates in, not every row - a do-not-edit row needs no worktree and
# the isolation helper does not look for it.
# Plan: docs/superpowers/plans/2026-11-01-dispatch-hands-over-the-whole-plan.md.
# Shipped by docs/superpowers/plans/2026-11-01-dispatch-hands-over-the-whole-plan.md; each
# criterion's test or check is in that plan's handover report.
- id: cloud-executor-attaches-every-checkout
  title: A cloud executor attaches every checkout the plan names before isolating
  status: shipped
  value: An executor running in a cloud session, which starts with only the repository
    it was opened on, attaches and clones every other checkout the plan's Repositories
    table names before it isolates, so isolation does not stop on a missing sibling.
    Today the kick-off prompt says nothing about it, and the executor finds one checkout.
  acceptanceCriteria:
    - When a plan's Repositories table names more than one checkout to isolate in, the prompt
      /dispatch prints tells the executor, before isolating, to attach each other
      checkout with its tool for adding a repository to the session, where it has one,
      and to clone each beside this one under the directory name the table gives.
    - The prompt names no vendor and no tool by name.
    - A plan that isolates in one checkout gets no such step, whatever do-not-edit rows
      its table has.
    - A dispatch test covers both cases and goes red with the step removed.
  type: improvement
  layer: product
  modules:
    - scripts/plan-binding.js
    - scripts/dispatch.mjs
    - guards/dispatch.test.js
    - framework/dispatch.md
  refs: []

