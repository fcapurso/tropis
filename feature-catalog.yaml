- id: backlog-shows-open-work-on-one-page
  title: The backlog shows open work on one page
  status: shipped
  value: Someone looking at a set-up project's backlog can see every open entry on
    one page, grouped by a judgment of what to do next kept apart from the catalog,
    with what blocks each entry and how far each arc has got, and /next suggests the
    same next piece of work the page puts at the top.
  acceptanceCriteria:
    - In a set-up project, npm --prefix .tropis run board writes one HTML page listing
      every open backlog entry, grouped by band, with what blocks each entry and how far
      each arc has got. Git ignores the page.
    - Bands and verdicts live in the project's own docs/backlog-board/bands.yaml. Setup
      writes it with its explanatory header and no rows, and taking a framework version
      never changes it.
    - The build lists open entries with no band, bands whose entry has shipped or gone,
      and bands whose entry has changed since the verdict was written, and exits 0
      either way; with --stamp it records the backlog as it now stands against every
      band.
    - /refresh-board takes someone through building, banding each new entry from its
      value and criteria rather than its title, stamping, rebuilding until nothing is
      listed, and committing the bands file. Publishing is a project-owned block, empty
      as shipped, and the shipped command names no single agent tool.
    - With bands written, /next suggests the highest-banded ready entry; an unbanded
      entry counts as E, an arc already under way goes first within a band, and D and E
      entries are listed but never suggested, a D labelled as needing a decision. For the
      same backlog and bands, the top entry on the board is the one /next suggests.
    - With no bands written, /next suggests what it suggests today.
    - A fresh checkout of a set-up project, and the framework's self-check, pass before
      the board has ever been built.
    - The operator guide says how to see the board and how to refresh it.
  type: feature
