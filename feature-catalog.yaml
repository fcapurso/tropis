    - A set-up project's checks fail when a plan named YYYY-MM-DD-flush-upstream.md
      carries a handover report and the queue's Last flushed date is earlier than the
      plan's date.
    - The failure names docs/BLUEPRINT-UPSTREAM.md and the date to set.
    - A flush plan with no handover report is not judged.
