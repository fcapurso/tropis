# Borrowed idea 1. Copy with fingerprints, in the separate harness repository, was chosen
# over a submodule by the developer on 2026-10-09; the analysis is in the spec. Blocked by the name because the folder and the command take it.
# 2026-10-14: the copy now lands in the project's own repository — .claude/ and
# .framework/ — not in a separate harness; updating builds on the one-repository setup.
# 2026-10-14: blocker project-is-set-up-in-its-own-repository shipped; dropped.
# 2026-10-15, by the developer, from the shaping of blueprint-tool-agnostic-name: this
# entry also renames the folder a project holds the framework in, .framework/ to .tropis/,
# on its first run — the hook entries, commands and installed checks that name it
# included — so no project has to move it by hand.
# 2026-10-15, from the shaping of rule-areas-are-project-data: its first run also moves an
# installed project to that entry's layout — shipped rule texts to .framework/rules/, their
# areas, read from the project's current headers, to .claude/rule-areas.json.
# 2026-10-15: blocker rule-areas-are-project-data shipped; dropped.
# 2026-10-15: blockers shipped-rules-have-project-companions and blueprint-tool-agnostic-name
# shipped; dropped.
# 2026-10-15, shaped with the developer. Decided by the developer: a project set up before
# fingerprints existed is compared on its first update with the files of the version it
# holds, read from the Tropis repository's tag, so only files it really changed get a .new;
# the backup is a clean git tree, not a copy — the command refuses a dirty tree and never
# commits, so git restore undoes an update; in .claude/settings.json the command replaces
# only the shipped hook entries and keeps the rest, because every project changes that file
# on day one (the shipped _comment says to delete it) and the move to .tropis/ rewrites every
# shipped hook command. Decided by the specifying session and stated to the developer: the
# command runs from a Tropis checkout at the wanted version, as set-up-project.sh does,
# until framework-installs-as-a-package; a version is breaking by its number, as the
# self-hosting design already defines it (below 1.0 the middle number, from 1.0 the first);
# a command's project-owned blocks are left out of its fingerprint and carried into the new
# version, as check-drift.sh already leaves them out. Built as two plans — the update
# command, then the one-time move for projects installed before it, run on this repository
# first — so the entry ships with the second.
# 2026-10-15, review of the first plan (docs/superpowers/plans/2026-10-15-take-a-framework-version.md,
# merged as 1f061b5): take-version.mjs counts a hook as shipped when its command names
# .framework/hooks/. The second plan, which moves the folder to .tropis/, must widen that
# test to .tropis/hooks/ too, or every shipped hook is kept as the project's own and
# duplicated on the next update.
- id: project-takes-a-framework-version
  title: A project takes a new framework version with one command
  status: shipped
  value: A project moves to a newer framework version with one command, run from a Tropis
    checkout at that version, and the version it now holds is recorded. A file the project
    changed is never overwritten — the new version is written beside it as .new — the
    command refuses to run on a tree with uncommitted changes, so git is the backup, and a
    version marked breaking needs an explicit yes. The project's own hook entries and
    other settings in .claude/settings.json survive every update. A fingerprint is recorded
    for each shipped file, and the suite fails when a shipped file no longer matches its
    fingerprint, so an edit to framework machinery is caught the day it is made rather
    than at the next update. Its first run on a project installed before it also moves the
    framework from .framework/ to .tropis/, the name the framework took in
    blueprint-tool-agnostic-name, and moves the project's shipped rules to the layout of
    rule-areas-are-project-data.
  acceptanceCriteria:
    - Run from a Tropis checkout at a newer version against a set-up project, one command
      brings the project's framework files to that version and records the version and a
      fingerprint per shipped file in the project. It never commits.
    - With uncommitted changes in the project, the command changes nothing and says why.
    - A shipped file the project has not changed is replaced with the new version's. A
      shipped file the project changed is left as it is, the new version is written
      beside it as <file>.new, and the command lists every .new file it wrote.
    - A file the new version no longer ships is removed when the project had not changed
      it, and left in place and listed when it had.
    - Files the project owns are never touched — the backlog, the entry files, the
      verification log, .claude/rule-areas.json, rule additions and the project's own
      rules. The text inside a command's project-owned blocks is carried into the new
      version of that command, and editing those blocks never produces a .new.
    - In .claude/settings.json the hook entries that run a script from the framework's
      hooks folder are replaced with the new version's, the project's own hook entries
      stay and run before the shipped ones for the same tool, and every other key is
      left as it was.
    - Taking a breaking version — a higher middle number below 1.0, a higher first number
      from 1.0 — asks for an explicit yes and changes nothing without it. Taking the
      version the project already holds, or an older one, changes nothing and says so.
    - In a project with no recorded version, the command asks which version it holds
      (or takes it as an argument) and judges what the project changed against that
      version's files from the Tropis repository, so a file left as shipped is replaced
      without a .new.
    - A check shipped to every project fails, naming the file, when a shipped file no
      longer matches its recorded fingerprint, project-owned blocks excepted.
    - On a project installed before the update command existed, the first run moves the
      framework from .framework/ to .tropis/ and rewrites every hook entry, command,
      script, check, package script and .gitignore and .gitattributes line that names the
      old folder; afterwards the project's suite passes and its hooks speak to an agent.
    - The same first run moves each shipped rule's text to the framework folder and its
      area, read from the rule's current paths header, to .claude/rule-areas.json, then
      generates the rule files; the project's own rules stay where they are, and a
      shipped rule whose text the project had changed is listed for the operator to move
      into a rule additions file rather than dropped.
    - This repository is updated from v0.1.0 to the next release with the command, and
      its suite passes afterwards.
    - The README tells an adopter how to take a new version and what to do with a .new
      file.
  type: feature
  layer: product
  modules:
    - scripts/take-version.mjs
    - scripts/installed-files.js
    - scripts/record-installed.mjs
    - scripts/set-up-project.sh
    - guards/installed-files.test.js
    - guards/take-version.test.js
  refs:
    - docs/superpowers/specs/2026-10-09-framework-updates-like-a-dependency-design.md
    - docs/superpowers/plans/2026-10-15-take-a-framework-version.md
    - docs/superpowers/plans/2026-10-16-framework-moves-to-tropis.md
    - docs/superpowers/plans/2026-10-16-this-repository-takes-v0-3-0.md
