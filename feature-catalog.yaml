# Evidence, 2026-10-25: taking v0.4.2 into this repository added the 12 export-ignore
# lines again without the leading slash. set-up-project.sh's append_once skips a line
# only when the identical line is present, and this repository's lines are anchored
# (/CLAUDE.md, not CLAUDE.md). Unanchored, they matched the sample project under
# fixtures/, which the self-check exports with git archive, and the self-check failed.
# Fixed by hand on #124.
# Decided: an anchored and an unanchored line count as the same line, and new lines
# are written anchored; a project's existing unanchored lines stay as they are.
# Gap found after capture: the same take also added docs/readme/, a new path rather
# than a duplicate, and here docs/readme/ holds the README skeleton and settings the
# self-check reads, so excluding it fails readme-usable. Matching anchored and
# unanchored lines does not stop that. .gitattributes has no ! negation; a project can
# unset the attribute with -export-ignore, but the take appends at the end of the file
# and a later line wins, so the take must skip a path the project has unset.
# Shaped 2026-10-27. It replaces setup-export-lines-match-only-the-root and
# update-keeps-ignore-lines-in-their-own-form, so criterion 2 covers .gitignore too. A
# path counts as kept when the project has a line for it that unsets the attribute
# (-export-ignore) or makes it unspecified (!export-ignore), with or without the slash.
# The .gitignore lines setup writes already match only at the root (each has a slash
# before its end), so only the export-ignore lines change form. Plan:
# docs/superpowers/plans/2026-10-27-export-ignore-lines-match-only-at-the-root.md.
# Handover report: docs/superpowers/plans/2026-10-27-export-ignore-lines-match-only-at-the-root.md
- id: export-ignore-lines-match-only-at-the-root
  title: An update never adds the export-ignore lines again, never excludes a path the project keeps, and new ones match only at the root
  status: shipped
  value: A project whose export-ignore lines start with a slash takes an update without
    getting the whole set again without one, which in this repository dropped the
    sample project from the self-check's export and failed it. A project that keeps
    one of the framework's paths in its exports, as this repository keeps docs/readme/
    for its self-check, says so once and no update excludes it again. A new project
    gets lines that match only at its root, so a file of the same name deeper in the
    project, such as a second CLAUDE.md in a subfolder, is not silently left out of
    every exported copy.
  acceptanceCriteria:
    - A newly set-up project's export-ignore lines each start with a slash, and a git
      archive of it carries a CLAUDE.md or a .claude/ folder that sits in a subfolder.
    - Taking an update, or running setup again, adds no ignore or export-ignore line
      the project already has, whether the project wrote it with a leading slash or
      without one.
    - A project with a line that unsets export-ignore for one of the framework's paths,
      such as /docs/readme/ -export-ignore, gets no export-ignore line for that path
      from an update or from setup, and the path stays in its exported copies.
    - The export-ignore lines a project already has without a slash are left exactly as
      they were by an update.
    - This repository keeps docs/readme/ in its exported copies with one such line, so
      the lines the next release's setup writes add nothing to its .gitattributes.
    - The operator guide says how a project keeps one of the framework's paths in its
      exported copies.
  type: bug
  layer: product
  modules:
    - scripts/set-up-project.sh
    - scripts/take-version.mjs
  refs: []
# Evidence, 2026-10-27: the self-check sentence on #127 went into CLAUDE.md only, and the
# developer had to point out that AGENTS.md, the copy Cursor reads, was identical until
# then. set-up-project.sh copies templates/CLAUDE.md into both files and /bootstrap fills
# both; the guards check only that AGENTS.md exists and that setup leaves it alone, so
# nothing notices when the two drift. Decided in conversation: one file holds the content,
# AGENTS.md, because Cursor does not expand @ imports; CLAUDE.md is the single line
# @AGENTS.md, because Claude Code does. A symlink was set aside as unreliable on Windows
# checkouts. Covers setup, /bootstrap, the guards, the update path for existing projects,
# and this repository's own pair.
# Shaped 2026-10-27 from the same conversation. Criterion 3 is about what a fresh session
# receives, so it is backed by a fresh-agent check recorded where the entry ships. Two
# files that differ are not merged by the update: which lines win is the developer's call.
# The fresh-agent check and what backs each criterion are in the handover report of
# docs/superpowers/plans/2026-10-27-entry-instructions-live-in-one-file.md.
- id: entry-instructions-live-in-one-file
  title: A project's entry instructions live in one file, so Claude Code and Cursor always read the same
  status: shipped
  value: Someone who edits a project's entry instructions edits one file, and every agent
    tool reads the change. Today setup writes the same text into CLAUDE.md and AGENTS.md
    and nothing keeps them together, so an edit to one leaves Cursor or Claude Code on
    stale instructions without any sign that anything is wrong.
  acceptanceCriteria:
    - A newly set-up project has its entry instructions in AGENTS.md, and its CLAUDE.md
      is the single line @AGENTS.md.
    - /bootstrap fills in AGENTS.md and leaves CLAUDE.md as that single line.
    - A fresh Claude Code session in a set-up project receives what AGENTS.md says,
      the development workflow it imports included.
    - Taking an update into a project whose CLAUDE.md and AGENTS.md are identical turns
      CLAUDE.md into the single line and keeps the content in AGENTS.md. Where the two
      differ, the update changes neither, names the lines that differ, and tells the
      developer to merge them into AGENTS.md.
    - The project's checks fail, naming the file, when CLAUDE.md is anything other than
      the single line @AGENTS.md.
    - This repository's own CLAUDE.md is the single line, and its AGENTS.md holds the
      content.
  type: bug
  layer: product
  modules:
    - templates/AGENTS.md
    - scripts/set-up-project.sh
    - scripts/take-version.mjs
    - guards/entry-file.test.js
  refs: []
# Evidence, 2026-10-27, from the review of release-is-rehearsed-on-a-candidate (#126):
# pipeline.mjs takes production's version as the first line of git tag --list 'v*'
# --sort=-v:refname, which on tags v1.0.0, v1.0.0-rc.1 and v1.1.0-rc.1 prints
# v1.1.0-rc.1, and ranks v1.0.0-rc.1 above v1.0.0. /release Stage 2 finds the last
# release with git describe --tags, which takes any tag at all. Tropis's own workflow
# never makes such tags (the candidate makes none, and this repository's release.mjs
# refuses anything but vX.Y.Z), but nothing tells a project not to. Decided in
# conversation: only vX.Y.Z counts as a release, in the code and in the documents.
# Captured shaped, because the fix and its checks were settled in that conversation.
# Handover report: docs/superpowers/plans/2026-10-27-only-release-tags-count-as-production.md
# Fresh-agent check: Claude Code 2.1.300, dev-laptop.local (Darwin arm64, macOS 26.2), pass. Probe 1: last release v1.0.0, commits "feat: second feature" and "fix: a fix" in scope, bump minor. Probe 2: the highest vX.Y.Z tag, v1.0.0 here, because only that form is a release.
- id: only-release-tags-count-as-production
  title: Only a vX.Y.Z tag counts as a release, so a pre-release tag never stands in for production
  status: shipped
  after:
    - release-is-rehearsed-on-a-candidate
  value: A project that tags test versions, such as v1.1.0-rc.1, can still rehearse a
    release safely. Today the rehearsal can take such a tag for the version production
    runs and reset the pre-production environment to a version production never ran,
    and /release can count the release's changes from it, with nothing to say either
    went wrong.
  acceptanceCriteria:
    - With tags v1.0.0, v1.0.0-rc.1 and v1.1.0-rc.1, the rehearsal resets the
      pre-production environment to v1.0.0, and its summary says so.
    - With only tags that are not of the form vX.Y.Z, the rehearsal does not run
      reset.sh, and its summary says there is no release yet.
    - /release lists the changes since the last vX.Y.Z tag, whatever other tags came
      after it.
    - The workflow document's release section and the operator guide say that only a
      vX.Y.Z tag counts as a release.
  type: bug
  layer: product
  modules:
    - scripts/pipeline.mjs
    - commands/release.md
  refs:
    - first-adopter:docs/superpowers/specs/2026-10-22-pipeline-and-environments-design.md
    - docs/superpowers/plans/2026-10-27-only-release-tags-count-as-production.md
# Raised 2026-10-27 by the developer while preparing to publish this repository as open
# source (#132 removed a customer's site name, the first adopter's real name and
# internals, local paths and the machine name). Nothing stops the same kind of material
# coming back. This entry is the deterministic layer for this repository only; the
# judgment layer every public project needs is public-project-is-checked-for-private-material.
# Due before the repository goes public. The list of specific names must be stored as
# SHA-256 hashes of lower-cased words, never in plain text: a published list of names
# would publish exactly what it protects. Its limit, stated in the AGENTS.md line: a name
# nobody has hashed yet passes.
# Shipped by docs/superpowers/plans/2026-10-28-own-files-refuse-private-material.md (handover report).
- id: own-files-refuse-private-material
  title: This repository refuses private material in its own files
  status: shipped
  value: Once the repository is public, a home path, a hostname, a customer's site or a
    private project's name cannot reach main through a commit that passes the
    self-check. Today the only defence is someone noticing, and the cleanup in pull request 132
    found about 300 such mentions that had built up unnoticed.
  acceptanceCriteria:
    - The self-check fails on a committed file that contains a home path (/Users/<name>/
      or /home/<name>/), a hostname of the form *-MacBook* or *.local, an
      *.atlassian.net site, a session UUID, or an email address outside an allowlist
      (example.com, example.test, noreply addresses), and names the file and line.
    - It fails on a word whose lower-cased SHA-256 is in the guard's list of hashed
      names, without the list itself containing any name in plain text.
    - It passes on the repository as it stands after pull request 132.
    - AGENTS.md says, under Gotchas, that the repository is public, that evidence from
      another project names it by pseudonym and never quotes its internals, and that a
      name nobody has hashed yet passes the guard.
  type: chore
  layer: framework
  modules:
    - guards/private-material.test.js
    - scripts/check-blueprint.sh
  refs:
    - docs/superpowers/specs/2026-10-27-tropis-goes-public-design.md
    - docs/superpowers/plans/2026-10-28-own-files-refuse-private-material.md
