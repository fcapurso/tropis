# Raised 2026-10-27 by the developer while preparing to publish this repository. Bundles
# three moments, at the developer's request, because each serves the one outcome: a
# public project gets a judgment check for private material wherever its content is
# exposed. In order of how much each prevents: (1) at commit and push, through the hook
# that already speaks at a commit (framework-commit-check.sh), because a public
# repository exposes content when it is pushed, not when it is released, and the paths
# that may go straight to main never see a review; (2) at merge review, as one line in
# the review record; (3) at /release, a scan of the release window before the notes are
# drafted, a backstop that cleans up rather than prevents, worth having because a
# release copies its files into every adopting project. A pull request from a fork is
# public once opened, so a check there protects main, not the contributor's text.
# Complements own-files-refuse-private-material, which only knows the names it was given.
# Shipped by plan docs/superpowers/plans/2026-10-28-public-project-is-checked-for-private-material.md,
# with its own hook rather than framework-commit-check.sh (FW-032). Criteria, as its
# handover report records them: (1) the take-version test that .claude/project.json
# survives an update; the bootstrap question was not exercised by a fresh agent, and the
# parent review confirmed it by reading Stage 3b. (2) the public-exposure-check tests in
# rule-delivery.test.js, and the plan's Task 5 runs one and two with a third run showing
# the reply reach the agent at the commit. (3) Task 5's review-record run. (4) the text
# of commands/release.md, Stage 3, confirmed by the parent review's reading.
- id: public-project-is-checked-for-private-material
  title: A public project is checked for private material wherever its content is exposed
  status: shipped
  after:
    - own-files-refuse-private-material
  value: A project whose repository is public is warned to look for people's names,
    customers, other projects' names or internals, home paths and hostnames at the
    moment that still prevents a leak, and again at review and at release. A list of
    known names cannot catch the next new one; a reader of the diff can.
  acceptanceCriteria:
    - A project can declare that its repository is public, and setup asks.
    - In a public project, at each git commit and git push, the agent is told to read
      the staged or outgoing diff for private material and to ask the developer before
      going on if it finds any. A project that is not public is told nothing.
    - The review record of a public project carries a line saying the diff was checked
      for public exposure and what was found, or that nothing was.
    - In a public project, /release lists anything in the release window that looks
      private before it drafts the notes, and asks whether to release anyway.
  type: feature
  layer: product
  modules:
    - scripts/public-exposure-check.sh
    - commands/release.md
    - commands/bootstrap.md
    - rules/planning.md
  refs:
