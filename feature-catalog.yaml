- id: project-knows-whether-to-update
  title: A project is told before updating whether it is safe, and why
  status: shipped
  value: Before taking a framework version, a project runs one check against itself and
    is told safe, safe with these steps, or not now, with the reasons — which shipped
    files change, whether its own settings and companions still fit, whether its suite
    passes against the new version in a scratch copy, and which rule changes alter what
    agents are told.
  acceptanceCriteria:
    - Run from a Tropis checkout at a newer version against a set-up project, one command
      answers safe, safe with these steps, or not now, with the reasons. It writes nothing
      in the project, and git status is the same afterwards.
    - It lists every shipped file the new version would replace, add or remove, and marks
      the ones the project changed, which taking the version would leave in place with a
      <file>.new beside them. It judges what the project changed the same way the take
      command does.
    - It says whether the project's own settings still fit the new version, naming each
      that does not - its hook entries in .claude/settings.json, the areas in
      .claude/rule-areas.json, additions to a shipped rule the new version renames or
      drops, and project-owned blocks in a command whose blocks changed.
    - It runs the project's own tests against the new version in a scratch copy and
      reports how many passed and failed, naming each failing test, without touching the
      project.
    - It lists each shipped rule whose text changes, by area, and shows what changes in
      it, so someone can see what agents will be told differently before taking the
      version.
    - It answers not now when those tests fail; safe with these steps when there would be
      .new files or settings that no longer fit, or the version is breaking, with the
      explicit yes the take command will ask for among the steps; and safe otherwise.
    - Asked about the version the project already holds, or an older one, it says there is
      nothing to take.
  type: feature
  layer: product
  modules:
    - scripts/check-version.mjs
    - scripts/take-version.mjs
  refs:
    - docs/superpowers/specs/2026-10-09-framework-updates-like-a-dependency-design.md
