# The framework's backlog. Format: templates/catalog.yaml; behaviour: rules/catalogs.md.
#
# `product` here means this repository's product: the framework itself.
#
# Started 2026-10-13 from the open entries of the first-adopter-harness catalog
# (docs/superpowers/specs/2026-10-09-framework-updates-like-a-dependency-design.md and
# its sibling specs, copied to docs/superpowers/specs/). A reference written
# `first-adopter-harness:<path>` names a file in that archived repository. An id in `after`,
# `blockedBy` or `supersededBy` that is not in this file names an entry of its catalog.
# A reference written `first-adopter:<path>` names a file in the application repository
# that project now lives in, alone, since 2026-10-13. Both repositories are private, and
# `first-adopter` is a pseudonym for that project.

- id: framework-doc-delivery
  title: Put a framework document in front of the agent that needs it
  status: shaped
  value: "A framework document reaches the agent at the moment it applies,
    rather than only being findable by one that goes looking. Reachability is
    now guarded, which is the weaker half: `commit-format.md` is reachable from
    an always-loaded document, but nothing asserts that an agent writing a
    commit opens it, and an agent dispatched to another vendor’s tool gets it
    only if the kick-off prompt names it. This is the residue of a failure that
    has recurred three times in the same shape, each time fixed by moving
    content rather than by closing the hole."
  acceptanceCriteria:
    - A framework document that applies to an action is delivered when that
      action is taken, not merely linked from somewhere reachable.
    - The mechanism does not put the whole framework into context on every edit.
    - A dispatched agent on a tool with no rule injection receives the same
      material, because the kick-off prompt carries it.
  type: improvement
  layer: product
  modules: []
  # Delivering a document at a moment needs a channel the agent hears; measured on
  # 2026-09-15, the hook channel was not one.
  # 2026-10-16, backlog cleanup: the blocker hook-injected-rules-reach-the-agent shipped in
  # the first-adopter-harness catalog and concluded that hooks are not how rules reach an
  # agent; rules now load by their paths header (FW-008, FW-009). Dropped. The third
  # criterion has the kick-off prompt carry the material, which framework/dispatch.md
  # rules out (the prompt carries only what the plan cannot); settle that when shaping
  # the plan.
  refs:
    - first-adopter-harness:docs/framework-review-2026-07.md
    - first-adopter-harness:docs/superpowers/plans/2026-07-28-p13-rule-delivery-guard.md
# Shipped by docs/superpowers/plans/2026-11-01-a-plan-states-its-result-as-checks.md
# (FW-041). Criteria are covered by the rule text in rules/planning.md and by the
# fresh-agent probe A in that plan's handover report and probe B as rerun in its
# review record. The rule reaches a plan's author through the planning area in
# .claude/rule-areas.json.
- id: plan-checks-must-be-falsifiable
  title: A plan states what its checks print when they pass
  status: shipped
  # Raised 2026-08-12 by the review of the technology-scope plan. Deliberately not part
  # of that arc: it is a defect in how plans are written, not in what the blueprint
  # claims, and it waits on nothing.
  value: Someone writing a plan is stopped from shipping a check that cannot
    tell success from failure. Three checks written here expected an output the
    work could never produce — one grepped for a phrase the plan itself wrapped
    across two lines, one expected a listing the backlog command withholds
    until something has shipped, and one demanded a count of zero for a string
    the authorised replacement text contains. Each was caught by the agent
    executing it, which is the system working and not a thing to keep spending.
  acceptanceCriteria:
    - The planning rule requires a check to state what it prints on success and
      on failure, and that the two differ.
    - The requirement reaches someone at the moment they write a plan, not only
      when they look for it.
    - The three recorded instances are named as evidence, so a later reader can
      tell the rule was earned rather than supposed.
  type: improvement
  layer: product
  modules:
    - rules/planning.md
    - framework/workflow.md
  refs:
    - first-adopter-harness:docs/superpowers/plans/2026-08-12-blueprint-technology-scope.md
    - docs/superpowers/plans/2026-11-01-a-plan-states-its-result-as-checks.md
# 2026-10-31, reshaped with the developer. Required checks on the host (the entry
# main-is-gated-by-the-host) stop a red pull request merging, so this entry keeps what
# no gate covers - the main branch going red after a merge, from a deploy or an
# environment, and everything a project without the gate merges. The signal lands at
# three moments that already exist rather than in a hook on every push, which was the
# first proposal and was dropped as costing a network call per command.
# Shipped by the handover in docs/superpowers/plans/2026-10-31-a-failing-push-is-visible.md.
# Criterion 1: guards/main-status.test.js "the merge sequence ends by waiting..." and the
# --wait tests, and probe B of the fresh-agent check in that plan's handover. Criterion
# 2: guards/dispatch.test.js "says the main branch is red before it creates the
# worktree...". Criterion 3: guards/next-report.test.js "says on its first line when the
# main branch is red" and probe A. Criterion 4: main-status.test.js "says it could not
# tell...", "gh is not installed", "gh did not answer", "never runs gh with..." (also
# with --wait), next-report "is unchanged without bands" and dispatch "says it could not
# tell where there is no origin". Criterion 5: every test that gives a repository a
# GitHub origin puts a stub gh first on PATH, and "never runs gh with..." shows a
# repository without one never runs gh.
- id: a-failing-push-is-visible
  title: A failed push is noticed before the next six land on top of it
  status: shipped
  value: Whoever merged finds out when the main branch went red, and so does whoever
    starts work next. Every push runs the checks and nothing reports the answer anywhere
    the next person will be standing - so a break lasted ten days and six further
    commits landed on top of it, and it surfaced only because someone thought to go and
    look. A gate on the host stops a red pull request merging, but the main branch can
    still go red after the merge, and a project without the gate has no protection at
    all; this is what makes that red seen.
  acceptanceCriteria:
    - The merge sequence ends by waiting for the run the merge started on the main
      branch, and the session that merged reports its result, stopping and saying so
      when it failed.
    - The isolation helper says, before it creates a worktree, when the last finished
      run on the main branch failed, naming the commit and the run, and still creates
      it.
    - The backlog report says the same on its first line.
    - Where the host cannot be asked, each of the three says it could not tell, and why,
      rather than saying nothing.
    - No test of any of the three reaches the network.
  type: improvement
  layer: product
  modules:
    - scripts/main-status.mjs
    - scripts/next.mjs
    - scripts/isolate-for-plan.mjs
    - framework/workflow.md
  refs:
    - first-adopter-harness:docs/superpowers/plans/2026-08-01-self-merge-writes-its-own-record.md
- id: framework-reaches-every-tool
  title: An agent gets the workflow whichever tool it runs in
  status: shaped
  value: "A plan dispatched to Cursor or Codex arrives with the same process an
    agent gets here. Today it does not: the entry file points at the workflow
    in a notation only Claude Code and Gemini expand, and the projection built
    for Cursor carries the area rules and nothing from the framework folder. So
    an agent in Cursor receives every area rule and no preflight, no worktree
    convention, no merge sequence and no documentation closeout — while the
    framework treats Cursor as a supported target and names it in the roster
    agents are dispatched from."
  acceptanceCriteria:
    - An agent reading only `AGENTS.md` in a tool that does not expand imports
      can still reach the workflow.
    - The workflow is delivered to Cursor by the same projection that already
      delivers the area rules.
    - A guard fails when a framework document is delivered to one tool and not
      another.
  type: bug
  layer: product
  # 2026-10-16, backlog cleanup: after instruction-layer-means-what-it-says, shipped in the
  # first-adopter-harness catalog; dropped. The first criterion already holds: AGENTS.md and
  # templates/CLAUDE.md tell a tool that does not expand the import to read the workflow.
  # The other two remain — no .cursor/rules/ file carries the workflow, and nothing checks.
  modules: []
  refs:
