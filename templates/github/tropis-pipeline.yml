# Tropis's pipeline. Replaced on update. To own it, copy this file to
# project-pipeline.yml and point pipeline.yml at that copy.

name: Tropis pipeline

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version for the pipeline
        type: string
        default: '22'

# npm cache: a job that installs packages, or runs the project's commands that may,
# restores ~/.npm keyed on the project's lock files, and only when one exists, so a
# project without one runs as before. plan and gate install nothing and leave it
# off: every job keyed on the same lock files shares one key, and plan runs first, so
# its empty cache would be the one every stage restored.
jobs:
  plan:
    if: ${{ github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    # The check for code that already passed reads this repository's runs and the pull
    # request a commit merged from. In a private repository that needs these grants,
    # and the workflow that calls this one must grant them too.
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      framework: ${{ steps.plan.outputs.framework }}
      sanity: ${{ steps.plan.outputs.sanity }}
      unit: ${{ steps.plan.outputs.unit }}
      integration: ${{ steps.plan.outputs.integration }}
      end-to-end: ${{ steps.plan.outputs.end-to-end }}
      end-to-end-on: ${{ steps.plan.outputs.end-to-end-on }}
      deploy: ${{ steps.plan.outputs.deploy }}
      lines: ${{ steps.plan.outputs.lines }}
      environment: ${{ steps.plan.outputs.environment }}
      branch: ${{ steps.plan.outputs.branch }}
      prose: ${{ steps.plan.outputs.prose }}
      create: ${{ steps.plan.outputs.create }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            environment=$(node .tropis/scripts/pipeline.mjs environment "$HEAD_REF")
            echo "environment=$environment" >> "$GITHUB_OUTPUT"
          fi
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"
            head="$PR_HEAD"
          else
            base="$PUSH_BEFORE"
            head="$PUSH_SHA"
          fi
          # A commit whose code already passed lets the plan skip the four stages.
          # Only a push to an open pull request (not its opening or reopening, which
          # follow a closed run that removed the environment) and the push to main.
          passed=""
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$ACTION" = "synchronize" ]; then
            passed=$(node .tropis/scripts/pipeline.mjs passed --branch "$HEAD_REF" --repository "$HEAD_REPO" --summary "$GITHUB_STEP_SUMMARY")
          elif [ "$EVENT_NAME" = "push" ]; then
            passed=$(node .tropis/scripts/pipeline.mjs passed --merged "$PUSH_SHA" --summary "$GITHUB_STEP_SUMMARY")
          fi
          passed_args=()
          if [ -n "$passed" ]; then
            # The merged branch is usually deleted by now; plan falls back if the host cannot serve the commit.
            git fetch --no-tags --quiet origin "$passed" || true
            passed_args=(--passed "$passed")
          fi
          pr_args=()
          if [ "$EVENT_NAME" = "pull_request" ]; then
            pr_args=(--action "$ACTION")
            if [ "$ACTION" = "synchronize" ]; then
              # A force push can leave the old head unfetched; it then plans as unknown.
              git fetch --no-tags --quiet origin "$PUSH_BEFORE" || true
              pr_args+=(--before "$PUSH_BEFORE")
            fi
          fi
          lines=$(node .tropis/scripts/pipeline.mjs plan --base "$base" --head "$head" --event "$EVENT_NAME" "${pr_args[@]}" "${passed_args[@]}")
          branch=$(printf '%s\n' "$lines" | sed -n 's/^branch=//p')
          if [ -z "$branch" ]; then
            echo "plan: no branch line" >&2
            exit 1
          fi
          {
            echo "branch=$branch"
            echo "lines<<PLAN_EOF"
            printf '%s\n' "$lines"
            echo "PLAN_EOF"
            printf '%s\n' "$lines"
          } >> "$GITHUB_OUTPUT"
      # Whether the main branch is gated by the host, or the project has said why not.
      # Last, so the outputs above are written first. A red answer fails this job and
      # the run, and the jobs below still run and decide as they would otherwise: each
      # reads the plan's outputs under !cancelled().
      - name: host
        if: ${{ !cancelled() }}
        run: node .tropis/scripts/pipeline.mjs host --summary "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}

  # The plan job fails when the host is not gated, after writing its outputs, so
  # every job that needs it reads those outputs under !cancelled(). branch= is
  # written only when planning succeeded.
  framework:
    needs: plan
    if: ${{ !cancelled() && github.event.action != 'closed' && needs.plan.outputs.branch != '' }}
    uses: ./.github/workflows/tropis-framework-checks.yml
    with:
      node-version: ${{ inputs.node-version }}

  sanity:
    needs: [plan, framework]
    if: ${{ !cancelled() && needs.framework.result == 'success' && needs.plan.outputs.sanity == 'run' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ hashFiles('**/package-lock.json', '**/npm-shrinkwrap.json', '!.tropis/**', '!**/node_modules/**') != '' && 'npm' || '' }}
          cache-dependency-path: |
            **/package-lock.json
            **/npm-shrinkwrap.json
            !.tropis/**
            !**/node_modules/**
      - run: node .tropis/scripts/pipeline.mjs run sanity
        env:
          TROPIS_SECRETS: ${{ toJSON(secrets) }}

  unit:
    needs: [plan, framework]
    if: ${{ !cancelled() && needs.framework.result == 'success' && needs.plan.outputs.unit == 'run' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ hashFiles('**/package-lock.json', '**/npm-shrinkwrap.json', '!.tropis/**', '!**/node_modules/**') != '' && 'npm' || '' }}
          cache-dependency-path: |
            **/package-lock.json
            **/npm-shrinkwrap.json
            !.tropis/**
            !**/node_modules/**
      - run: node .tropis/scripts/pipeline.mjs run unit
        env:
          TROPIS_SECRETS: ${{ toJSON(secrets) }}

  integration:
    needs: [plan, framework]
    if: ${{ !cancelled() && needs.framework.result == 'success' && needs.plan.outputs.integration == 'run' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ hashFiles('**/package-lock.json', '**/npm-shrinkwrap.json', '!.tropis/**', '!**/node_modules/**') != '' && 'npm' || '' }}
          cache-dependency-path: |
            **/package-lock.json
            **/npm-shrinkwrap.json
            !.tropis/**
            !**/node_modules/**
      - run: node .tropis/scripts/pipeline.mjs run integration
        env:
          TROPIS_SECRETS: ${{ toJSON(secrets) }}

  end-to-end:
    needs: [plan, framework]
    if: ${{ !cancelled() && needs.framework.result == 'success' && needs.plan.outputs.end-to-end == 'run' && needs.plan.outputs.end-to-end-on != 'environment' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ hashFiles('**/package-lock.json', '**/npm-shrinkwrap.json', '!.tropis/**', '!**/node_modules/**') != '' && 'npm' || '' }}
          cache-dependency-path: |
            **/package-lock.json
            **/npm-shrinkwrap.json
            !.tropis/**
            !**/node_modules/**
      - run: node .tropis/scripts/pipeline.mjs run end-to-end
        env:
          TROPIS_SECRETS: ${{ toJSON(secrets) }}

  # Opening or reopening a pull request that is not prose creates the environment,
  # and so does the first push that gives a prose pull request other changes, once
  # GitHub says the pull request is still open. A pull request of prose alone gets
  # none. It does not wait for the stages. One group per branch (the shared
  # environment on a push), so the closing job can name it before anything has
  # run: at most one of these jobs runs, a new pending job replaces an older
  # pending one, and a running job is not cancelled.
  # https://docs.github.com/en/actions/using-jobs/using-concurrency
  branch-create:
    needs: plan
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.plan.outputs.branch == 'filled' && needs.plan.outputs.create == 'run' }}
    runs-on: ubuntu-latest
    concurrency:
      group: tropis-env-${{ github.repository }}-${{ github.event.pull_request.head.ref || 'shared' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ hashFiles('**/package-lock.json', '**/npm-shrinkwrap.json', '!.tropis/**', '!**/node_modules/**') != '' && 'npm' || '' }}
          cache-dependency-path: |
            **/package-lock.json
            **/npm-shrinkwrap.json
            !.tropis/**
            !**/node_modules/**
      - run: node .tropis/scripts/pipeline.mjs branch create "$HEAD_REF" --if-open "$PR_NUMBER"
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          TROPIS_SECRETS: ${{ toJSON(secrets) }}

  # On a pull request with a filled branch slot, the end-to-end stage tests the
  # pull request's own commit in its environment. It waits for the other stages
  # and for the environment, then deploys and tests inside the environment's
  # group, so no other run deploys over the environment while it is under test.
  # The gate takes this job's result as the stage's and does not deploy again.
  end-to-end-deployed:
    needs: [plan, framework, sanity, unit, integration, branch-create]
    if: ${{ !cancelled() && needs.plan.outputs.end-to-end-on == 'environment' && needs.framework.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.sanity.result) && contains(fromJSON('["success","skipped"]'), needs.unit.result) && contains(fromJSON('["success","skipped"]'), needs.integration.result) && needs.branch-create.result != 'failure' }}
    runs-on: ubuntu-latest
    concurrency:
      group: tropis-env-${{ github.repository }}-${{ github.event.pull_request.head.ref || 'shared' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ hashFiles('**/package-lock.json', '**/npm-shrinkwrap.json', '!.tropis/**', '!**/node_modules/**') != '' && 'npm' || '' }}
          cache-dependency-path: |
            **/package-lock.json
            **/npm-shrinkwrap.json
            !.tropis/**
            !**/node_modules/**
      - run: node .tropis/scripts/pipeline.mjs branch deploy "$HEAD_REF"
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          TROPIS_SECRETS: ${{ toJSON(secrets) }}
      - run: node .tropis/scripts/pipeline.mjs run end-to-end --branch "$HEAD_REF"
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          TROPIS_SECRETS: ${{ toJSON(secrets) }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: end-to-end-evidence
          path: end-to-end-evidence/
          retention-days: 7
          if-no-files-found: ignore

  # A condition with no status function is combined with success(), which is
  # false once an empty stage was skipped. always() runs the gate anyway.
  # A closed pull request removes the environment and runs no stage.
  gate:
    needs: [plan, framework, sanity, unit, integration, end-to-end, end-to-end-deployed]
    if: ${{ always() && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
      - id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          BRANCH: ${{ needs.plan.outputs.branch }}
          FRAMEWORK: ${{ needs.framework.result }}
          SANITY: ${{ needs.sanity.result }}
          UNIT: ${{ needs.unit.result }}
          INTEGRATION: ${{ needs.integration.result }}
          END_TO_END: ${{ needs.end-to-end.result }}
          END_TO_END_DEPLOYED: ${{ needs.end-to-end-deployed.result }}
          PLAN_LINES: ${{ needs.plan.outputs.lines }}
        # The gate exits 1 when it holds the deploy, so this job is the run's required check.
        run: |
          decision=$(printf '%s\n' "$PLAN_LINES" | node .tropis/scripts/pipeline.mjs gate \
            --plan - --event "$EVENT_NAME" --branch "$BRANCH" --summary "$GITHUB_STEP_SUMMARY" \
            "framework=$FRAMEWORK" "sanity=$SANITY" "unit=$UNIT" \
            "integration=$INTEGRATION" "end-to-end=$END_TO_END" "end-to-end-deployed=$END_TO_END_DEPLOYED")
          echo "deploy=${decision#deploy=}" >> "$GITHUB_OUTPUT"

  # !cancelled() rather than always(), so a cancelled run does not deploy.
  # A skipped create is not a failure: a later push still deploys.
  deploy:
    needs: [plan, gate, branch-create]
    if: ${{ !cancelled() && needs.gate.outputs.deploy == 'run' && needs.branch-create.result != 'failure' }}
    runs-on: ubuntu-latest
    concurrency:
      group: tropis-env-${{ github.repository }}-${{ github.event.pull_request.head.ref || 'shared' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ hashFiles('**/package-lock.json', '**/npm-shrinkwrap.json', '!.tropis/**', '!**/node_modules/**') != '' && 'npm' || '' }}
          cache-dependency-path: |
            **/package-lock.json
            **/npm-shrinkwrap.json
            !.tropis/**
            !**/node_modules/**
      - if: github.event_name == 'pull_request'
        run: node .tropis/scripts/pipeline.mjs branch deploy "$HEAD_REF"
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          TROPIS_SECRETS: ${{ toJSON(secrets) }}
      - if: github.event_name != 'pull_request'
        run: node .tropis/scripts/pipeline.mjs run deploy
        env:
          TROPIS_SECRETS: ${{ toJSON(secrets) }}

  # A closed pull request starts this job alone. It decides whether the branch slot
  # is filled and whether the pull request was prose alone, and removes the
  # environment only when the slot is filled and it was not.
  branch-remove:
    if: ${{ github.event.action == 'closed' }}
    runs-on: ubuntu-latest
    concurrency:
      group: tropis-env-${{ github.repository }}-${{ github.event.pull_request.head.ref || 'shared' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ hashFiles('**/package-lock.json', '**/npm-shrinkwrap.json', '!.tropis/**', '!**/node_modules/**') != '' && 'npm' || '' }}
          cache-dependency-path: |
            **/package-lock.json
            **/npm-shrinkwrap.json
            !.tropis/**
            !**/node_modules/**
      - id: plan
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # The head branch may be deleted already; an unresolved head plans prose=no.
          git fetch --no-tags --quiet origin "$PR_HEAD" || true
          node .tropis/scripts/pipeline.mjs plan --closed --base "$PR_BASE" --head "$PR_HEAD" >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.branch == 'filled' && steps.plan.outputs.prose != 'yes'
        run: node .tropis/scripts/pipeline.mjs branch remove "$HEAD_REF"
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          TROPIS_SECRETS: ${{ toJSON(secrets) }}
