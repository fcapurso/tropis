# The project owns this file. Change the branch name below to the branch
# deploys run from. To own the pipeline, copy
# .github/workflows/tropis-pipeline.yml to
# .github/workflows/project-pipeline.yml and point the job below at that copy.

name: Pipeline

on:
  push:
    branches: [main]
  # closed is what removes a branch's environment.
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  pipeline:
    # What the pipeline's token may do. The pipeline reads its own runs and pull
    # requests to skip code that already passed. A stage or deploy script that needs
    # more, such as packages: read or id-token: write, adds it here: a job that lists
    # permissions has only those.
    permissions:
      actions: read
      contents: read
      pull-requests: read
    uses: ./.github/workflows/tropis-pipeline.yml
    secrets: inherit
