# The release job. Pull requests and pushes to main run through pipeline.yml,
# whose unit stage is the self-check. The notes reach main already promoted
# under the version, through /release's notes commit, so this job commits
# nothing: it checks that the notes on main name the version and that it is not
# tagged yet, self-checks the very commit it tags, tags it, and pushes only the
# tag. It is started by hand, on main, by the developer — never by an agent:
#   gh workflow run ci.yml --ref main -f version=<X.Y.Z>
name: Self-check and release

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version the notes on main were promoted to, X.Y.Z
        type: string
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Releases are cut from main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Started on $GITHUB_REF. Start the release job on main."
          exit 1
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: The notes name this version, and it is not tagged yet
        id: notes
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node .github/scripts/release.mjs check RELEASES.md "$VERSION"
          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            echo "v$VERSION is already tagged."
            exit 1
          fi
      # The commit that is tagged, checked before anything is pushed: a failure here
      # ends the job, and the tag never leaves the runner.
      - name: Self-check the commit to tag
        run: bash scripts/check-blueprint.sh
      - name: Tag and push the tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
